<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>离线 - 资料下载中心</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            text-align: center;
            padding: 80px 20px;
            background: #f6f8fc;
            color: #1a1a2e;
        }
        .icon {
            font-size: 80px;
            display: block;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }
        p {
            color: #666;
            max-width: 400px;
            margin: 0 auto 20px;
            line-height: 1.8;
        }
        .retry-btn {
            padding: 12px 32px;
            border-radius: 999px;
            border: 2px solid #2c3e8f;
            background: transparent;
            color: #2c3e8f;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .retry-btn:hover {
            background: #2c3e8f;
            color: #fff;
        }
    </style>
</head>
<body>
    <span class="icon">📡</span>
    <h1>网络连接已断开</h1>
    <p>请检查你的网络连接，然后刷新页面重新加载资料列表。</p>
    <button class="retry-btn" onclick="location.reload()">🔄 重新加载</button>
</body>
</html>
