<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>📝 云端笔记系统</title>
    <script>
        // GitHub Pages SPA 重定向
        // 将所有404请求重定向到首页
        sessionStorage.setItem('redirectPath', location.pathname + location.search);
        location.replace('/' + location.pathname.split('/')[1] + '/');
    </script>
</head>
