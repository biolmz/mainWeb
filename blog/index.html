<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人博客</title>
<style>
  :root {
    --bg: #fafafa;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --hover: #f0f9ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.6;
    min-height: 100vh;
  }
  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 60px 24px 80px;
  }
  header { margin-bottom: 48px; }
  header h1 {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  header p { color: var(--muted); font-size: 0.95rem; }
  .separator {
    width: 40px;
    height: 2px;
    background: var(--accent);
    border: none;
    margin: 32px 0;
  }
  .post-list { list-style: none; }
  .post-item { border-bottom: 1px solid var(--line); }
  .post-item:last-child { border-bottom: none; }
  .post-link {
    display: block;
    padding: 20px 0;
    text-decoration: none;
    color: inherit;
    transition: background 0.15s;
    border-radius: 8px;
    padding: 20px 4px;
  }
  .post-link:hover { background: var(--hover); }
  .post-link:hover .post-title { color: var(--accent); }
  .post-title {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 4px;
    transition: color 0.15s;
  }
  .post-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .post-meta .dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--muted);
  }
  .post-desc {
    font-size: 0.9rem;
    color: var(--muted);
    margin-top: 6px;
  }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    background: #eff6ff;
    color: var(--accent);
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 500;
  }
  .empty { text-align: center; padding: 60px 0; color: var(--muted); }
  footer {
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 0.82rem;
    color: var(--muted);
  }
  @media (max-width: 480px) {
    .container { padding: 40px 16px 60px; }
    header h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>个人博客</h1>
    <p>记录思考，分享发现</p>
  </header>
  <hr class="separator">
  <ul class="post-list" id="postList">
    <li class="empty">加载中...</li>
  </ul>
  <footer>
    <span>&copy; 2026 个人博客</span>
  </footer>
</div>
<script src="posts.js"></script>
</body>
</html>
