<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>导航</title>

<!-- 安全头 -->
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta http-equiv="Referrer-Policy" content="no-referrer">

<style>
  body { font-family: sans-serif; padding: 40px; background: #f5f5f5; }
  a {
    display: block;
    margin: 12px 0;
    color: #333;
    text-decoration: none;
    font-size: 18px;
    /* 防止钓鱼：确保链接不会被 JS 偷偷改掉 */
    pointer-events: auto;
  }
  a:hover { color: #0078d7; }
</style>
</head>
<body>

<!-- rel="noopener noreferrer" 防止新标签页劫持 + 不泄露来源 -->
<a href="https://www.baidu.com" target="_blank" rel="noopener noreferrer">百度</a>
<a href="https://www.google.com" target="_blank" rel="noopener noreferrer">Google</a>
<a href="https://github.com" target="_blank" rel="noopener noreferrer">GitHub</a>
<a href="https://www.bilibili.com" target="_blank" rel="noopener noreferrer">B站</a>

</body>
</html>
