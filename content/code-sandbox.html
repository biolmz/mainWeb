<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Local Code Sandbox</title>
<!-- defer：并行加载、不阻塞 HTML 解析，按序在 DOMContentLoaded 前执行完毕 -->
<script defer src="https://cdn.jsdelivr.net/npm/jszip@3/dist/jszip.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>

<!-- ============================================================
     CodeMirror 5：代码高亮编辑器
     - codemirror.js / codemirror.css       核心
     - mode: xml(html) / css / javascript   三种语言模式
     - addon: matchbrackets / closebrackets / active-line 编辑增强
     - theme: monokai(深色) / default(浅色) / 
     ============================================================ -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/monokai.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/default.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/eclipse.css" />
<style>
  /* ==========================================================
   * 主题系统：通过 [data-theme] 属性切换 CSS 变量
   *   light  白天 / dark  黑夜 / hc  高对比度 / auto  跟随系统
   * ========================================================== */
  :root {
    --bg: #1e1e2e; --panel: #181825; --tab: #11111b; --border: #313244;
    --text: #cdd6f4; --muted: #a6adc8; --accent: #89b4fa;
    --ok: #a6e3a1; --warn: #f9e2af; --err: #f38ba8;
    --editor-bg: #181825; --console-line: #26263a; --preview-bg: #ffffff;
  }
  [data-theme="light"] {
    --bg: #ffffff; --panel: #f5f5f7; --tab: #ececef; --border: #dcdcdc;
    --text: #24292f; --muted: #57606a; --accent: #0969da;
    --ok: #1a7f37; --warn: #9a6700; --err: #cf222e;
    --editor-bg: #ffffff; --console-line: #ececec; --preview-bg: #ffffff;
  }
  [data-theme="dark"] { /* 默认深色 = 当前 :root */ }
  [data-theme="hc"] {
    --bg: #000000; --panel: #0a0a0a; --tab: #000000; --border: #ffffff;
    --text: #ffffff; --muted: #ffff00; --accent: #00ffff;
    --ok: #00ff00; --warn: #ffff00; --err: #ff5555;
    --editor-bg: #000000; --console-line: #222222; --preview-bg: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; overflow: hidden;
    transition: background .2s, color .2s;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; font-weight: 600; white-space: nowrap; }
  header h1 span { color: var(--accent); }
  .spacer { flex: 1; }
  select, button {
    background: var(--tab); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .font-size-label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #fontSize {
    width: 52px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--tab); color: var(--text); font-size: 12px; text-align: center;
  }
  #fontSize:focus { outline: none; border-color: var(--accent); }
  /* 全局字号变量：编辑器 / Console / AST 统一联动
   * 关键：CodeMirror 实际渲染代码的节点是内部的 .CodeMirror pre / .CodeMirror-line，
   * 这些节点在 codemirror.css 里有自己的固定 font-size，会覆盖父级 .CodeMirror。
   * 所以必须【直接命中这些叶子节点】 + CodeMirror API(setOption fontSize)，双保险。
   * !important 确保赢过 codemirror.css 的默认声明。 */
  .console, .ast-out, .ast-src { font-size: var(--font-size, 13px); }
  .CodeMirror,
  .CodeMirror pre,
  .CodeMirror .CodeMirror-line,
  .CodeMirror .CodeMirror-lines,
  .CodeMirror .CodeMirror-code,
  .CodeMirror .CodeMirror-gutters,
  .CodeMirror .CodeMirror-linenumber { font-size: var(--font-size, 13px) !important; }
  .console .line { font-size: var(--font-size, 12px) !important; }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
  .status {
    font-size: 11px; padding: 3px 8px; border-radius: 4px;
    background: var(--tab); color: var(--muted); white-space: nowrap;
  }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .status.busy { color: var(--warn); }

  .main { flex: 1; display: flex; min-height: 0; }
  .editors { width: 50%; display: flex; flex-direction: column; border-right: 1px solid var(--border); min-width: 0; }
  .editor-tabs, .preview-tabs { display: flex; background: var(--tab); border-bottom: 1px solid var(--border); }
  .editor-tab, .preview-tab {
    padding: 8px 16px; font-size: 12px; cursor: pointer;
    border-right: 1px solid var(--border); color: var(--muted); user-select: none;
  }
  .editor-tab.active, .preview-tab.active { background: var(--panel); color: var(--text); }
  .editor-stack, .preview-stack { flex: 1; position: relative; min-height: 0; }
  .editor-pane { position: absolute; inset: 0; display: none; flex-direction: column; }
  .editor-pane.active { display: flex; }

  /* CodeMirror 容器铺满 pane，融入主题 */
  .CodeMirror {
    flex: 1; height: auto; font-family: "Consolas", "Menlo", monospace;
    background: var(--editor-bg); color: var(--text);
  }
  .CodeMirror-scroll { flex: 1; }
  .CodeMirror-gutters { background: var(--editor-bg); border-right: 1px solid var(--border); }
  .CodeMirror-linenumber { color: var(--muted); }
  .CodeMirror-cursor { border-left-color: var(--text); }
  /* 高对比度主题下增强光标 / 选中可见性 */
  [data-theme="hc"] .CodeMirror-cursor { border-left-width: 2px; }
  [data-theme="hc"] .CodeMirror-selected, .CodeMirror-selected { background: var(--accent) !important; color: #000 !important; }

  .preview-col { width: 50%; display: flex; flex-direction: column; min-width: 0; }
  .preview-pane { position: absolute; inset: 0; display: none; }
  .preview-pane.active { display: block; }
  iframe { width: 100%; height: 100%; border: none; background: var(--preview-bg); }

  .console {
    position: absolute; inset: 0; background: var(--panel); overflow-y: auto;
    font-family: "Consolas", monospace; font-size: 12px; padding: 8px;
  }
  .console .line { padding: 3px 6px; border-bottom: 1px solid var(--console-line); white-space: pre-wrap; word-break: break-word; }
  .console .line.log { color: var(--text); }
  .console .line.info { color: var(--accent); }
  .console .line.warn { color: var(--warn); }
  .console .line.error { color: var(--err); }
  .console .line .lvl { opacity: .6; margin-right: 6px; }
  .console-empty { color: var(--muted); font-style: italic; padding: 8px; }

  .ast-pane { position: absolute; inset: 0; display: none; flex-direction: column; }
  .ast-pane.active { display: flex; }
  .ast-src {
    height: 40%; resize: none; border: none; outline: none;
    background: var(--editor-bg); color: var(--text);
    font-family: monospace; font-size: 12px; padding: 8px; border-bottom: 1px solid var(--border);
  }
  .ast-out { flex: 1; overflow: auto; padding: 8px; font-family: monospace; font-size: 11px; background: var(--tab); color: var(--muted); white-space: pre; }
  .ast-err { color: var(--err); padding: 8px; }

  /* 预览加载遮罩（防闪烁 + 给出反馈） */
  .preview-loading {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: var(--panel); color: var(--muted); font-size: 12px; z-index: 5; gap: 8px;
  }
  .preview-loading.show { display: flex; }
  .spinner {
    width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <header>
    <h1>⚡ Local <span>Sandbox</span></h1>
    <div class="toolbar">
      <label>JS 模式
        <select id="jsMode">
          <option value="babel">Babel (ES6+/JSX)</option>
          <option value="typescript">TypeScript</option>
          <option value="raw">原生 JS (无编译)</option>
        </select>
      </label>
      <label>主题
        <select id="themeSel">
          <option value="auto">🌗 跟随系统</option>
          <option value="light">☀️ 白天</option>
          <option value="dark">🌙 黑夜</option>
          <option value="hc">🔲 高对比度</option>
        </select>
      </label>
      <button id="runBtn">▶ 运行</button>
      <button id="resetBtn">↺ 重置预设</button>
      <button id="exportBtn">⬇ 导出 ZIP</button>
      <label class="font-size-label">字号
        <input type="number" id="fontSize" min="10" max="28" step="1" value="13" title="字体大小（px）" />
      </label>
      <button id="clearConsole">清空全部</button>
      <span class="status" id="status">就绪</span>
    </div>
    <div class="spacer"></div>
  </header>

  <div class="main">
    <!-- 左侧编辑器 -->
    <div class="editors">
      <div class="editor-tabs">
        <div class="editor-tab active" data-pane="html">HTML</div>
        <div class="editor-tab" data-pane="css">CSS</div>
        <div class="editor-tab" data-pane="js">JS</div>
      </div>
      <div class="editor-stack">
        <!-- 内容由 DEFAULT_SOURCES 预设注入（js/loadPreset），textarea 保持为空壳 -->
        <div class="editor-pane active" data-pane="html">
          <textarea class="editor" id="editor-html" spellcheck="false"></textarea>
        </div>
        <div class="editor-pane" data-pane="css">
          <textarea class="editor" id="editor-css" spellcheck="false"></textarea>
        </div>
        <div class="editor-pane" data-pane="js">
          <textarea class="editor" id="editor-js" spellcheck="false"></textarea>
        </div>
      </div>
    </div>

    <!-- 右侧预览 -->
    <div class="preview-col">
      <div class="preview-tabs">
        <div class="preview-tab active" data-pane="preview">预览</div>
        <div class="preview-tab" data-pane="console">Console</div>
        <div class="preview-tab" data-pane="ast">AST</div>
      </div>
      <div class="preview-stack">
        <div class="preview-pane active" data-pane="preview">
          <div class="preview-loading" id="loading"><div class="spinner"></div>运行中…</div>
          <iframe id="preview" sandbox="allow-scripts allow-modals allow-forms"></iframe>
        </div>
        <div class="preview-pane" data-pane="console">
          <div class="console" id="console"></div>
        </div>
        <div class="ast-pane" data-pane="ast">
          <textarea class="ast-src" id="astSrc" spellcheck="false">// AST 解析：展示当前 JS 的抽象语法树
// 可在此直接编辑，切换 Tab 查看</textarea>
          <div class="ast-out" id="astOut">（等待解析…）</div>
        </div>
      </div>
    </div>
  </div>

<!-- CodeMirror 核心 + 语言模式 + 编辑增强插件（defer 并行加载，不阻塞首屏） -->
<script defer src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/matchbrackets.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/selection/active-line.js"></script>

<script>
"use strict";
/* ============================================================
 * 0. 工具：rAF 节流（流畅性优化，合并高频输入）
 * ============================================================ */
function rafThrottle(fn) {
  let scheduled = false, lastArgs = null;
  return function (...args) {
    lastArgs = args;
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      fn.apply(this, lastArgs);
    });
  };
}

/* ============================================================
 * 1. 主题系统（白天 / 黑夜 / 高对比度 / 跟随系统）
 *    - 持久化到 localStorage
 *    - auto 模式监听 prefers-color-scheme 媒体查询实时切换
 *    - 同步切换 CodeMirror 编辑器主题
 * ============================================================ */
const themeSel = document.getElementById("themeSel");
const THEME_KEY = "sandbox.theme";
let mediaQuery = null, mediaListener = null;

// 主题 → CodeMirror 主题名映射
function cmThemeFor(theme) {
  if (theme === "light") return "default";   // 浅色：default
  if (theme === "hc") return "eclipse";      // 高对比：eclipse(黑字浅底变体)
  return "monokai";                           // 深色/跟随(深色)用 monokai
}
function applyTheme(theme) {
  const resolved = theme === "auto"
    ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
    : theme;
  document.documentElement.setAttribute("data-theme", resolved);
  // 同步编辑器主题
  if (window.__editors) {
    const cmTheme = cmThemeFor(resolved);
    Object.values(window.__editors).forEach((cm) => cm.setOption("theme", cmTheme));
  }
}
function setTheme(theme) {
  applyTheme(theme);
  lsSet(THEME_KEY, theme);
  // auto 模式：绑定系统变化监听
  if (mediaListener && mediaQuery) mediaQuery.removeEventListener("change", mediaListener);
  if (theme === "auto") {
    mediaQuery = window.matchMedia("(prefers-color-scheme: light)");
    mediaListener = () => applyTheme("auto");
    mediaQuery.addEventListener("change", mediaListener);
  }
}
themeSel.addEventListener("change", () => setTheme(themeSel.value));
setTheme(lsGet(THEME_KEY) || "auto");
themeSel.value = lsGet(THEME_KEY) || "auto";

/* ============================================================
 * 2b. 字体大小（全局：编辑器 / Console / AST 联动，持久化）
 *     ★ 保证生效的三重保险（踩坑记录）：
 *       1) :root --font-size CSS 变量（Console/AST/普通节点）
 *       2) CodeMirror API  setOption("fontSize") —— 官方推荐，作用于 .CodeMirror pre
 *       3) 直接给 .CodeMirror pre / .CodeMirror-line 写 inline style 兜底
 *          因为 codemirror.css 给这些叶子节点设了固定 font-size，
 *          仅靠父级 .CodeMirror 的变量会被覆盖 → 表现为"改字号无反应"
 *     ★ 脚本同步阶段【立即自执行一次】，不依赖 window.load，
 *        保证首次打开即有 --font-size，且从 localStorage 恢复记忆值。
 * ============================================================ */
const FONT_KEY = "sandbox.fontSize";
const fontSizeInput = document.getElementById("fontSize");

// 规范化：钳制到 [10, 28]，非法值回退 13
function normSize(size) {
  const n = Number(size);
  return Number.isFinite(n) ? Math.min(28, Math.max(10, Math.round(n))) : 13;
}

function applyFontSize(size) {
  const px = normSize(size);
  // 保险1：CSS 变量（Console / AST / 未高亮的普通节点）
  document.documentElement.style.setProperty("--font-size", px + "px");
  // 保险2 + 3：CodeMirror 编辑器（API + inline 兜底，遍历所有实例）
  if (window.__editors) {
    Object.values(window.__editors).forEach((cm) => {
      try {
        cm.setOption("fontSize", px + "px"); // 官方 API，作用于渲染节点
        cm.refresh();                          // 字号变化需刷新排版
      } catch (e) {}
    });
  }
  // 兜底：直接命中真实渲染节点，即使编辑器未就绪/API 失效也生效
  document.querySelectorAll(
    ".CodeMirror, .CodeMirror pre, .CodeMirror .CodeMirror-line, .CodeMirror .CodeMirror-lines, .CodeMirror .CodeMirror-code"
  ).forEach((el) => { el.style.fontSize = px + "px"; });
  // 同步输入框 & 持久化
  fontSizeInput.value = px;
  lsSet(FONT_KEY, String(px));
}

// ★ 立即自执行：脚本解析到此即应用一次（读取 localStorage 记忆值，无则 13）
//   不放在 window.load 里，避免"load 未触发 → 字号从未初始化"的死锁
(function initFontSize() {
  applyFontSize(lsGet(FONT_KEY) || fontSizeInput.value || 13);
})();

// 输入/失焦/方向键都触发，确保即时响应
fontSizeInput.addEventListener("input", () => applyFontSize(fontSizeInput.value));
fontSizeInput.addEventListener("change", () => applyFontSize(fontSizeInput.value));

// 安全读写 localStorage（opaque origin / 隐私模式可能抛错，静默降级）
function lsGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function lsSet(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }

/* ============================================================
 * 2. 标签切换逻辑
 * ============================================================ */
function bindTabs(rootSel, tabSel, paneSel) {
  const root = document.querySelector(rootSel);
  root.querySelectorAll(tabSel).forEach((tab) => {
    tab.addEventListener("click", () => {
      const name = tab.dataset.pane;
      root.querySelectorAll(tabSel).forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      root.parentElement.querySelectorAll(paneSel).forEach((p) => {
        p.classList.toggle("active", p.dataset.pane === name);
      });
      if (name === "ast") updateAST();
    });
  });
}
bindTabs(".editors", ".editor-tab", ".editor-pane");
bindTabs(".preview-col", ".preview-tab", ".preview-pane, .ast-pane");

/* ============================================================
 * 3. Console 拦截 + postMessage 桥接
 * ============================================================ */
const consoleEl = document.getElementById("console");
const statusEl = document.getElementById("status");
let consoleClearPending = false;

function appendConsole(level, args) {
  // 批量 DOM 更新，避免高频日志卡顿
  if (consoleClearPending) { consoleEl.innerHTML = ""; consoleClearPending = false; }
  const line = document.createElement("div");
  line.className = "line " + level;
  const lvl = document.createElement("span");
  lvl.className = "lvl";
  lvl.textContent = `[${level}]`;
  line.appendChild(lvl);
  line.appendChild(document.createTextNode(args.map(formatVal).join(" ")));
  consoleEl.appendChild(line);
  // 限制条数，防止内存膨胀
  while (consoleEl.childNodes.length > 500) consoleEl.removeChild(consoleEl.firstChild);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}
function formatVal(v) {
  if (v instanceof Error) return v.stack || v.message;
  if (typeof v === "object" && v !== null) {
    try { return JSON.stringify(v); } catch (e) { return String(v); }
  }
  return String(v);
}
["log", "info", "warn", "error", "debug"].forEach((lvl) => {
  const orig = console[lvl].bind(console);
  console[lvl] = (...args) => { appendConsole(lvl, args); orig(...args); };
});

// 接收来自 iframe 的 console 消息（来源校验增强安全性）
window.addEventListener("message", (e) => {
  const data = e.data;
  if (!data || typeof data !== "object") return;
  if (data.__sandbox === "console") {
    appendConsole(data.level, data.args);
  } else if (data.__sandbox === "error") {
    appendConsole("error", [data.message]);
    setStatus("err", "运行时错误");
  }
});

// 「清空全部」：立即清空控制台 + 清空三编辑器 + AST，恢复空白状态
document.getElementById("clearConsole").addEventListener("click", () => {
  if (!confirm("确定清空控制台和全部代码（HTML/CSS/JS）？此操作不可撤销。")) return;
  // 1) 立即清空控制台（不等下一帧）
  consoleEl.innerHTML = "";
  consoleClearPending = false;
  // 2) 清空所有编辑器 + AST 面板
  const empty = { html: "", css: "", js: "" };
  Object.keys(empty).forEach((id) => {
    if (window.__editors && window.__editors[id]) window.__editors[id].setValue(empty[id]);
    else document.getElementById("editor-" + id).value = empty[id];
  });
  const astSrc = document.getElementById("astSrc");
  astSrc.value = "";
  astSrc.dataset.synced = "1";
  updateAST();
  // 3) 立即重新运行空白页面
  clearTimeout(runTimer);
  run();
  appendConsole("info", ["已清空全部代码和控制台"]);
});

function setStatus(kind, msg) {
  statusEl.className = "status" + (kind ? " " + kind : "");
  statusEl.textContent = msg;
}

/* ============================================================
 * 4. 编译管道（Babel / TypeScript / Raw）
 * ============================================================ */
function compileJS(src, mode) {
  if (mode === "raw") return { code: src };
  if (typeof Babel === "undefined") return { error: "Babel 尚未加载（请检查网络 / CDN）" };
  const presets = [];
  if (mode === "typescript") presets.push(["typescript", { allExtensions: true, isTSX: true }]);
  if (mode === "babel") presets.push(["env", { targets: { esmodules: true } }], "react");
  try {
    const out = Babel.transform(src, {
      presets,
      filename: mode === "typescript" ? "src.tsx" : "src.jsx",
      sourceType: "script",
    });
    return { code: out.code };
  } catch (e) {
    return { error: e.message };
  }
}

/* ============================================================
 * 5. 预设代码（集中管理：HTML / CSS / JS 开箱即用）
 *    - 首次加载、点击「重置预设」均从此处注入
 *    - JS 默认用 ES6+（Babel 模式），含交互 + console 演示
 * ============================================================ */
const DEFAULT_SOURCES = {
  html: `<div class="card">
  <h1>Hello <span id="name">Sandbox</span> 👋</h1>
  <p id="out">正在初始化…</p>
  <div class="row">
    <button onclick="handleClick()">点我 +1</button>
    <button onclick="reset()">重置</button>
  </div>
</div>`,
  css: `.card {
  font-family: system-ui, "Segoe UI", sans-serif;
  text-align: center;
  padding: 48px 24px;
  color: #2d3436;
  background: linear-gradient(135deg, #74b9ff, #a29bfe);
  min-height: 100vh;
  box-sizing: border-box;
}
h1 { margin: 0 0 12px; font-size: 28px; }
#out { font-size: 16px; margin-bottom: 20px; color: #fff; }
.row { display: flex; gap: 12px; justify-content: center; }
button {
  padding: 10px 20px;
  border: none;
  background: #2d3436;
  color: #fff;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: transform .15s;
}
button:hover { transform: scale(1.05); }
button:active { transform: scale(.97); }`,
  js: `// ES6+ / JSX（Babel 模式）。切换 TS 模式可写 TypeScript
let count = 0;
const out = document.getElementById("out");
const nameEl = document.getElementById("name");

const greet = (name) => \`Hello, \${name}! 点击了 \${count} 次\`;

function render() {
  out.textContent = greet(nameEl.textContent);
}

function handleClick() {
  count++;
  render();
  console.log("按钮点击", count);
}

function reset() {
  count = 0;
  render();
  console.info("已重置");
}

render();
console.info("脚本初始化完成 ✅");`,
};

/* ============================================================
 * 6. 编译缓存（按 source + mode 指纹，避免无变化时重复编译/重建）
 * ============================================================ */
let compileCache = { key: null, code: null };

function getCompiled(rawJS, mode) {
  const key = mode + "|" + rawJS;
  if (compileCache.key === key) return { code: compileCache.code, cached: true };
  const result = compileJS(rawJS, mode);
  if (result.code != null) { compileCache = { key, code: result.code }; }
  return { ...result, cached: false };
}

/* ============================================================
 * 7. AST 解析（基于 Babel parser）
 * ============================================================ */
let astTimer = null;
function updateAST() {
  const src = document.getElementById("astSrc").value;
  const out = document.getElementById("astOut");
  try {
    const parser = Babel.packages && Babel.packages.parser;
    if (!parser || !parser.parse) throw new Error("当前 Babel 版本未暴露 parser");
    const ast = parser.parse(src, { sourceType: "script" });
    const program = ast.program ? ast.program : ast;
    out.textContent = JSON.stringify(program, null, 2);
  } catch (e) {
    out.innerHTML = `<div class="ast-err">解析错误：${e.message}</div>`;
  }
}
// AST 用独立防抖，避免与主运行管道互相抢占
document.getElementById("astSrc").addEventListener("input", () => {
  clearTimeout(astTimer); astTimer = setTimeout(updateAST, 250);
});

/* ============================================================
 * 6. 构建 iframe srcdoc（隔离执行环境）
 *    - 每次重建 iframe 彻底隔离状态（稳定性）
 *    - 作用域包裹 try/catch，防止单条错误中断后续
 * ============================================================ */
const iframe = document.getElementById("preview");
const loadingEl = document.getElementById("loading");

function buildSrcDoc({ html, css, js }) {
  return `<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>${css}<\/style>
</head>
<body>
${html}
<script>
  // ---- console 拦截：转发到父窗口 ----
  function send(level, args){
    try {
      parent.postMessage({
        __sandbox: "console",
        level: level,
        args: args.map(function(a){
          if (a instanceof Error) return { __err: true, message: a.message, stack: a.stack };
          if (typeof a === "object" && a !== null) {
            try { return JSON.parse(JSON.stringify(a)); } catch(e){ return String(a); }
          }
          return a;
        })
      }, "*");
    } catch(e){}
  }
  ["log","info","warn","error","debug"].forEach(function(lvl){
    console[lvl] = function(){ send(lvl, [].slice.call(arguments)); };
  });
  window.addEventListener("error", function(e){
    parent.postMessage({ __sandbox: "error", message: e.message }, "*");
  });
  window.addEventListener("unhandledrejection", function(e){
    parent.postMessage({ __sandbox: "error", message: "UnhandledRejection: " + (e.reason && e.reason.message || e.reason) }, "*");
  });
<\/script>
<script>
  try {
    ${js}
  } catch(err) {
    console.error(err);
  }
<\/script>
</body>
</html>`;
}

/* ============================================================
 * 7. 运行管道（rAF 节流 + 防抖 + 加载状态）
 * ============================================================ */
let runTimer = null;
let loadTimer = null;
function scheduleRun() {
  clearTimeout(runTimer);
  runTimer = setTimeout(run, 200); // 200ms 防抖：兼顾实时感与避免高频无效编译
}

// 收尾：隐藏遮罩 + 更新状态（被 iframe load / 超时 / 编译失败 三处统一调用）
function finishRun(ok) {
  clearTimeout(loadTimer);
  loadingEl.classList.remove("show");
  if (ok) setStatus("ok", "就绪");
}

let lastSrcDoc = ""; // 上次注入的 srcdoc 指纹，内容无变化时跳过重建

function run() {
  const mode = document.getElementById("jsMode").value;
  // 从 CodeMirror 实例读取值（无编辑器时降级到 textarea）
  const getValue = (id) => (window.__editors && window.__editors[id]) ? window.__editors[id].getValue() : document.getElementById("editor-" + id).value;
  const rawJS = getValue("js");
  const css = getValue("css");
  const html = getValue("html");

  // ---- 编译（命中缓存时零开销，不重复走 Babel）----
  let compiled, error = null;
  if (mode !== "raw" && typeof Babel === "undefined") {
    error = "Babel 尚未加载，已降级为原生 JS 运行（部分语法可能不兼容）";
    compiled = { code: rawJS, cached: false };
  } else {
    compiled = getCompiled(rawJS, mode); // 缓存命中直接返回
  }
  if (compiled.error) error = compiled.error;
  if (error && mode !== "raw") appendConsole("warn", ["[编译] " + error]);

  const srcdoc = buildSrcDoc({ html, css, js: compiled.code || rawJS });

  // ---- 内容无变化：跳过 iframe 重建（最大性能收益点）----
  if (srcdoc === lastSrcDoc) {
    setStatus("ok", "就绪");
    return;
  }

  setStatus("busy", compiled.cached ? "刷新中…" : "编译中…");
  loadingEl.classList.add("show");
  lastSrcDoc = srcdoc;

  // 重建 iframe：彻底隔离每次执行，避免旧状态污染
  iframe.srcdoc = srcdoc;

  // 超时兜底：即使 load 事件未触发（CDN/网络异常），也不让遮罩永久卡住
  clearTimeout(loadTimer);
  loadTimer = setTimeout(() => finishRun(true), 1500);
}

// iframe 加载完成 → 隐藏遮罩（核心修复：原版缺失此步，导致"运行中…"常驻）
iframe.addEventListener("load", () => finishRun(true));
// 错误兜底：iframe 加载异常时给出提示
iframe.addEventListener("error", () => {
  setStatus("err", "iframe 加载失败");
  finishRun(false);
});

document.getElementById("runBtn").addEventListener("click", () => { clearTimeout(runTimer); run(); });

/* ============================================================
 * 8. CodeMirror 初始化（代码高亮编辑器）
 *    - HTML: xml 模式 / CSS: css / JS: javascript(含 JSX)
 *    - Tab 键缩进、括号匹配、自动闭合、当前行高亮
 *    - 输入时触发实时预览（rAF 节流）
 *    - 主题跟随系统切换（applyTheme 中同步）
 * ============================================================ */
const EDITOR_CONFIG = {
  html: { mode: "text/html", htmlMode: true },
  css:  { mode: "text/css" },
  js:   { mode: "text/javascript" },
};

function initEditors() {
  if (typeof CodeMirror === "undefined") return false; // CDN 未就绪
  const resolved = document.documentElement.getAttribute("data-theme") || "dark";
  const cmTheme = cmThemeFor(resolved);
  const editors = {};

  Object.keys(EDITOR_CONFIG).forEach((key) => {
    const ta = document.getElementById("editor-" + key);
    const cfg = EDITOR_CONFIG[key];
    const cm = CodeMirror.fromTextArea(ta, {
      mode: cfg.mode,
      theme: cmTheme,
      lineNumbers: true,        // 行号
      indentUnit: 2,            // 2 空格缩进
      tabSize: 2,
      lineWrapping: true,       // 自动换行
      matchBrackets: true,       // 括号匹配
      autoCloseBrackets: true,   // 自动闭合括号/引号
      styleActiveLine: true,     // 当前行高亮
    });

    // Tab 键输入缩进（默认是焦点切换，这里改为插入缩进）
    cm.setOption("extraKeys", {
      Tab: (cm) => {
        if (cm.somethingSelected()) cm.indentSelection("add");
        else cm.replaceSelection("  ");
      },
      "Shift-Tab": (cm) => cm.indentSelection("subtract"),
    });

    // 输入时触发实时预览（rAF 节流）
    cm.on("change", () => {
      if (key === "js") {
        const astSrc = document.getElementById("astSrc");
        if (astSrc.dataset.synced !== "1") {
          astSrc.value = cm.getValue();
          astSrc.dataset.synced = "1";
        }
      }
      onInput();
    });

    editors[key] = cm;
  });

  window.__editors = editors;
  // ★ 编辑器创建后重新应用字号：fromTextArea 会重建 DOM，
  //   之前的 inline 兜底样式会被冲掉，这里用统一函数重新作用于新 DOM
  applyFontSize(lsGet(FONT_KEY) || fontSizeInput.value || 13);
  return true;
}

/* ============================================================
 * 9. 输入绑定（实时预览 + AST 同步，rAF 节流优化流畅性）
 * ============================================================ */
const onInput = rafThrottle(() => scheduleRun());

document.getElementById("jsMode").addEventListener("change", () => {
  updateAST();
  clearTimeout(runTimer); run();
});

/* ============================================================
 * 10. 导出 ZIP（JSZip 客户端纯本地打包）
 *    - index.html         完整可运行单文件（合并 HTML/CSS/编译后JS）
 *    - source/app.js      JS 源码（原始，未编译）
 *    - source/app.css     CSS 源码
 *    - source/app.tsx     若为 TS 模式则保留原始 TSX
 *    - README.md
 * ============================================================ */
const exportBtn = document.getElementById("exportBtn");
exportBtn.addEventListener("click", () => {
  if (typeof JSZip === "undefined") {
    appendConsole("error", ["[导出失败] JSZip 未加载，请检查网络后重试"]);
    setStatus("err", "导出失败");
    return;
  }
  const mode = document.getElementById("jsMode").value;
  const getValue = (id) => (window.__editors && window.__editors[id]) ? window.__editors[id].getValue() : document.getElementById("editor-" + id).value;
  const html = getValue("html");
  const css = getValue("css");
  const rawJS = getValue("js");

  // 导出时固定编译一份，确保 index.html 直接双击可跑
  const { code: compiledJS, error } = compileJS(rawJS, mode);
  if (error) {
    appendConsole("warn", ["[导出] 编译存在错误，仍将导出源码供参考：", error]);
  }

  const zip = new JSZip();
  const standaloneJS = compiledJS || rawJS;

  // 完整单文件版本（优先级最高，双击即用）
  const indexHtml = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sandbox Export</title>
<style>
${css}
</style>
</head>
<body>
${html}
<script>
${standaloneJS}
<\/script>
</body>
</html>`;
  zip.file("index.html", indexHtml);

  // 源码目录
  zip.file("source/app.css", css);
  zip.file("source/app.js", rawJS);
  if (mode === "typescript") zip.file("source/app.tsx", rawJS);

  zip.file("README.md", `# Local Sandbox Export

- **index.html** : 完整可运行单文件，浏览器直接打开即可预览
- **source/app.js** : JS 源码（TS 模式下为原始 TSX）
- **source/app.css** : 样式源码

> 由 Local Code Sandbox 导出
`);

  zip.generateAsync({ type: "blob" }).then((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "sandbox-export.zip";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    // 延迟释放，避免 Safari 下载截断
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setStatus("ok", "已导出");
    appendConsole("info", ["[导出] sandbox-export.zip 已生成"]);
  }).catch((e) => {
    appendConsole("error", ["[导出失败] " + e.message]);
    setStatus("err", "导出失败");
  });
});

/* ============================================================
 * 11. 预设加载 / 重置
 *   - loadPreset：把 DEFAULT_SOURCES 写入编辑器 + 立即运行
 *   - 供首次初始化 & 「重置预设」按钮共用
 * ============================================================ */
function loadPreset() {
  const setVal = (id, val) => {
    if (window.__editors && window.__editors[id]) window.__editors[id].setValue(val);
    else document.getElementById("editor-" + id).value = val;
  };
  setVal("html", DEFAULT_SOURCES.html);
  setVal("css",  DEFAULT_SOURCES.css);
  setVal("js",   DEFAULT_SOURCES.js);
  // AST 面板同步初始源码
  const astSrc = document.getElementById("astSrc");
  astSrc.value = DEFAULT_SOURCES.js;
  astSrc.dataset.synced = "1";
  updateAST();
  clearTimeout(runTimer);
  run();
}

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("确定恢复默认预设代码？当前编辑内容将被覆盖。")) loadPreset();
});

/* ============================================================
 * 12. 初始化（首屏速度优化）
 *   - 优先用 DEFAULT_SOURCES 预设做首屏即时渲染，保证秒出
 *   - CodeMirror 就绪(load) 后再初始化，避免阻塞
 *   - 编辑器就绪后切换到完整编译管道重跑（Babel 可用时）
 * ============================================================ */
updateAST();

// 首屏即时渲染：无论 CDN 是否就绪，先用预设以 raw 方式秒出画面
(function firstPaint() {
  const { html, css, js } = DEFAULT_SOURCES;
  setStatus("busy", "加载中…");
  loadingEl.classList.add("show");
  iframe.srcdoc = buildSrcDoc({ html, css, js });
  clearTimeout(loadTimer);
  loadTimer = setTimeout(() => finishRun(true), 1500);
})();

// CDN 就绪后：初始化编辑器 + 把预设写入编辑器 + 完整编译管道重跑
window.addEventListener("load", () => {
  const ready = initEditors();
  if (ready) {
    // 编辑器就绪后再写入预设（fromTextArea 后 setValue 才有效）
    const setVal = (id, val) => window.__editors[id].setValue(val);
    setVal("html", DEFAULT_SOURCES.html);
    setVal("css",  DEFAULT_SOURCES.css);
    setVal("js",   DEFAULT_SOURCES.js);
  }
  if (typeof Babel !== "undefined") {
    // Babel 可用 → 用当前模式（TS/JSX）完整编译一次
    clearTimeout(runTimer);
    run();
  } else {
    // 未加载 Babel 也要把预设同步进编辑器（纯 textarea 场景）
    if (!ready) {
      document.getElementById("editor-html").value = DEFAULT_SOURCES.html;
      document.getElementById("editor-css").value  = DEFAULT_SOURCES.css;
      document.getElementById("editor-js").value   = DEFAULT_SOURCES.js;
    }
  }
});
</script>
</body>
</html>
