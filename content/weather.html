<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>天气预报</title>
<!-- DNS 预解析 + 预连接：让高德/wttr 握手提前完成 -->
<link rel="dns-prefetch" href="https://webapi.amap.com">
<link rel="dns-prefetch" href="https://wttr.in">
<link rel="preconnect" href="https://webapi.amap.com" crossorigin>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --card: rgba(255,255,255,.16);
    --line: rgba(255,255,255,.22);
    --text: #fff;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    min-height: 100vh;
    background: linear-gradient(160deg, #1a2a6c 0%, #2b4a8c 35%, #4a90b8 70%, #7ec8d8 100%);
    background-attachment: fixed;
    padding: 20px 16px 40px;
    overflow-x: hidden;
  }
  body.bg-night { background: linear-gradient(160deg, #0a0e2c 0%, #1a1f4e 50%, #2a2f5c 100%); }
  body.bg-rain  { background: linear-gradient(160deg, #2c3e50 0%, #4a6278 50%, #6d8999 100%); }
  body.bg-snow  { background: linear-gradient(160deg, #4a5f8c 0%, #7d99c2 50%, #b8d4e8 100%); }
  body.bg-cloud { background: linear-gradient(160deg, #4a5a6c 0%, #6d7d8c 50%, #9aabba 100%); }
  body.bg-sun   { background: linear-gradient(160deg, #1a2a6c 0%, #3a7bd5 45%, #00d2ff 100%); }

  .wrap { max-width: 480px; margin: 0 auto; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .topbar .loc {
    display: flex; align-items: center; gap: 8px;
    font-size: 17px; font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,.25);
    text-align: left; min-width: 0;
  }
  .topbar .loc .pin { font-size: 18px; flex-shrink: 0; }
  .topbar .loc .loc-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
  .topbar .loc .loc-city { font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .loc .loc-sub { font-size: 11px; font-weight: 400; opacity: .85; margin-top: 2px; }
  .topbar .refresh {
    background: var(--card); border: 1px solid var(--line);
    color: #fff; width: 38px; height: 38px; border-radius: 50%;
    font-size: 18px; cursor: pointer; display: grid; place-items: center;
    transition: transform .3s; flex-shrink: 0;
  }
  .topbar .refresh:active { transform: rotate(180deg); }

  .clock-card {
    background: var(--card);
    border: 1px solid var(--line);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-radius: 22px; padding: 22px 20px;
    text-align: center; margin-bottom: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,.12);
  }
  .clock-card .time {
    font-size: 56px; font-weight: 200; letter-spacing: 2px;
    line-height: 1; font-variant-numeric: tabular-nums;
  }
  .clock-card .date {
    margin-top: 10px; font-size: 14px; opacity: .9;
    display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
  }

  .main-card {
    background: var(--card);
    border: 1px solid var(--line);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-radius: 22px; padding: 26px 20px;
    text-align: center; margin-bottom: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,.12);
  }
  .main-card .icon { font-size: 72px; line-height: 1; margin-bottom: 4px; }
  .main-card .cond { font-size: 18px; font-weight: 500; margin-bottom: 12px; }
  .main-card .temp {
    font-size: 76px; font-weight: 100; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .main-card .temp sup { font-size: 32px; vertical-align: super; font-weight: 300; }
  .main-card .range { margin-top: 12px; font-size: 14px; opacity: .92; }

  .grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; margin-bottom: 16px;
  }
  .metric {
    background: var(--card);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 16px; padding: 14px 6px; text-align: center;
  }
  .metric .m-icon { font-size: 20px; margin-bottom: 6px; }
  .metric .m-val { font-size: 16px; font-weight: 600; }
  .metric .m-lab { font-size: 11px; opacity: .8; margin-top: 3px; }

  .section-title {
    font-size: 14px; font-weight: 600; margin: 4px 4px 12px;
    text-shadow: 0 1px 2px rgba(0,0,0,.2);
    display: flex; align-items: center; gap: 6px;
  }

  .hours {
    display: flex; gap: 6px; overflow-x: auto;
    padding: 4px 2px 12px; margin-bottom: 16px;
    scrollbar-width: none;
  }
  .hours::-webkit-scrollbar { display: none; }
  .hour {
    flex: 0 0 auto; width: 62px;
    background: var(--card);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 14px; padding: 12px 4px; text-align: center;
  }
  .hour .h-time { font-size: 12px; opacity: .9; }
  .hour .h-icon { font-size: 22px; margin: 8px 0; }
  .hour .h-temp { font-size: 15px; font-weight: 600; }

  .days { margin-bottom: 10px; }
  .day {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    align-items: center; gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 8px;
  }
  .day .d-name { font-size: 15px; font-weight: 500; }
  .day .d-icon { font-size: 24px; }
  .day .d-temp { font-size: 14px; font-variant-numeric: tabular-nums; min-width: 78px; text-align: right; }
  .day .d-bar { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.18); position: relative; overflow: hidden; margin-top: 2px; }
  .day .d-bar i { position: absolute; left: 0; top: 0; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #6dd5fa, #ff8c42); }
  .foot { text-align: center; font-size: 11px; opacity: .6; margin-top: 18px; line-height: 1.6; }

  /* ===== 骨架屏（首屏瞬时可见，避免白屏等待感）===== */
  .skeleton .sk {
    background: linear-gradient(90deg, rgba(255,255,255,.12) 25%, rgba(255,255,255,.28) 37%, rgba(255,255,255,.12) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.3s ease infinite;
    border-radius: 12px;
  }
  @keyframes shimmer { 0%{background-position:100% 50%} 100%{background-position:0 50%} }
  .sk-clock { height: 140px; border-radius: 22px; margin-bottom: 16px; }
  .sk-main  { height: 220px; border-radius: 22px; margin-bottom: 16px; }
  .sk-grid  { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
  .sk-grid .sk { height: 76px; }
  .sk-line  { height: 60px; border-radius: 14px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <!-- 骨架屏：HTML 内联即渲染，用户几乎感觉不到延迟 -->
  <div class="topbar">
    <div class="loc"><span class="pin">📍</span><div class="loc-text">
      <div class="loc-city skeleton"><span class="sk" style="display:inline-block;width:110px;height:20px;"></span></div>
    </div></div>
  </div>
  <div class="clock-card"><div class="time" id="clock-time">--:--:--</div><div class="date" id="clock-date">----年--月--日 星期--</div></div>
  <div class="skeleton"><div class="sk sk-main"></div><div class="sk-grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>
  <div class="section-title">🕐 未来 24 小时</div>
  <div class="skeleton"><div class="sk sk-line"></div></div>
</div>

<!-- ============ 高德地图 JS API ============ -->

  window._AMapSecurityConfig = { securityJsCode: 'aa074f8de410ad51e79f6c3854d0f0f0' };

<script>
/* ============ 配置 ============ */
let CURRENT_CITY = '';      // 高德逆地理：城市/区县，用于精准天气查询
let CURRENT_DISTRICT = '';  // 更精确的区县（优先使用）
let CURRENT_ADCODE = '';    // 逆地理得到的 adcode，传给 Web 服务接口（最精准）
const CACHE_KEY = 'weather_cache_v1';
const CACHE_TTL = 10 * 60 * 1000;   // 缓存 10 分钟，重复进入/刷新秒开
const AMAP_KEY  = '644ba036afbaa4b2192358e505c35638';   // JS API Key（定位用）
const AMAP_WEB_KEY = '3fdfbbbc833c14ccb246c3bac9d5da6c';   // ★★★ 申请的【Web 服务 Key】，用于 weatherInfo 接口
const AMAP_WEB_SEC = 'ab5986e6cc4dd9d33d17d6aed920cda0';   // ★★★ Web 服务 Key 对应的安全密钥
const CORS_PROXY = '';     // 若 Web 服务接口跨域，取消注释： 'https://corsproxy.io/?url='
// Web 服务接口地址（extensions=all 返回实况+未来3天预报）
const WEATHER_API = 'https://restapi.amap.com/v3/weather/weatherInfo';

/* ============ 图标（基于高德天气现象汉字精确映射，更精准）============ */
function iconFor(cond){
  const w = (cond||'').trim();
  if(!w||w==='未知') return '🌈';
  if(/晴/.test(w)&&!/多云|间/.test(w)) return '☀️';
  if(/热/.test(w)) return '🥵';
  if(/冷/.test(w)) return '🥶';
  if(/雷阵雨|雷暴|雷电|冰雹/.test(w)) return '⛈️';
  if(/阵雨|小雨|中雨|大雨|暴雨|大暴雨|特大暴雨|极端降雨|毛毛雨|细雨|雨夹雪|冻雨|降雨/.test(w)) return '🌧️';
  if(/雨/.test(w)) return '🌦️';
  if(/暴雪|大雪|中雪|小雪|阵雪|雨雪/.test(w)) return '🌨️';
  if(/雪/.test(w)) return '🌨️';
  if(/雾|霾|霾|沙尘|扬沙|浮尘|沙尘暴/.test(w)) return '🌫️';
  if(/阴/.test(w)) return '☁️';
  if(/少云|晴间多云/.test(w)) return '⛅';
  if(/多云/.test(w)) return '⛅';
  if(/风/.test(w)) return '🌬️';
  return '🌤️';
}
// 白天/夜间判断（用于背景切换）
function isNightWeather(cond){
  return /夜|晚/.test(cond||'');
}

/* ============ 缓存（刷新/重进秒开）============ */
const cache = {
  get(){ try { const o = JSON.parse(localStorage.getItem(CACHE_KEY)||'{}'); if (Date.now()-o.t<CACHE_TTL) return o.data; } catch(e){} return null; },
  set(d){ try { localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(), data:d})); } catch(e){} }
};

/* ============ 时钟 + 日期（独立定时器，稳定持续更新）============
 * 要求：完全前端，秒数每秒刷新，日期/星期在跨天(00:00)时自动刷新。
 * 关键：用 setInterval（比 rAF 更可靠，后台标签页也会尽力触发），
 *       日期独立更新，渲染后节点重建时自动重绑引用。
 */
let clockTimer = null;

// 获取当前「日期字符串」，供时钟与星期计算统一使用
function formatDate(now){
  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  const d = now.getDate();
  const wk = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][now.getDay()];
  return `${y}年${m}月${d}日 ${wk}`;
}

// 每次 render 后调用：重绑时钟节点引用，立即刷新一次，避免显示占位值
function bindClock(){
  const tEl = document.getElementById('clock-time');
  const dEl = document.getElementById('clock-date');
  if(!tEl || !dEl) return;
  // 立即刷新一次，防止节点重建后短暂显示 --:-- / ----
  const now = new Date();
  tEl.textContent = now.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  dEl.textContent = formatDate(now);
}

function startClock(){
  // 防止重复启动多个定时器（render 会多次调用 startClock）
  if (clockTimer) return;
  bindClock();                 // 立即渲染首帧，不等下一个 tick
  clockTimer = setInterval(()=>{
    const tEl = document.getElementById('clock-time');
    const dEl = document.getElementById('clock-date');
    if(!tEl || !dEl) return;
    const now = new Date();
    // ① 时间：每秒更新
    tEl.textContent = now.toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    // ② 日期：每秒校对（成本极低，且保证 00:00 跨天时立即刷新星期/日期）
    dEl.textContent = formatDate(now);
  }, 1000);
}

/* ============ 名称清洗 ============ */
function splitLocation(raw){
  if(!raw) return { city:'当前位置', sub:'' };
  let parts = raw.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  parts = parts.filter(p => !/^(中国|中华人民共和国|PRC)$/i.test(p));
  if(!parts.length) return { city:'当前位置', sub:'' };
  return { city: parts[0], sub: parts.slice(1).join(' · ') };
}

/* ============ 渲染 ============ */
function render(data){
  const { loc, locSource, now, hours, days, dataSource } = data;
  const { city, sub } = splitLocation(loc);
  const w = (now.cond||'');
  const isNight = isNightWeather(w);
  const body = document.body;
  body.className = '';
  if (isNight) body.classList.add('bg-night');
  else if (/雷阵雨|暴雨|大暴雨|大雨|中雨|小雨|阵雨|雨夹雪|冻雨|毛毛雨|细雨/.test(w)) body.classList.add('bg-rain');
  else if (/暴雪|大雪|中雪|小雪|阵雪|雨雪/.test(w)) body.classList.add('bg-snow');
  else if (/雾|霾|沙尘|浮尘|扬沙/.test(w)) body.classList.add('bg-cloud');
  else if (/阴|多云|少云|晴间多云/.test(w)) body.classList.add('bg-cloud');
  else body.classList.add('bg-sun');

  const minT = Math.min(...days.map(x=>x.min));
  const maxT = Math.max(...days.map(x=>x.max));

  let html = `
    <div class="topbar">
      <div class="loc"><span class="pin">📍</span><div class="loc-text">
        <div class="loc-city">${city}</div>
        <div class="loc-sub">${sub ? sub + ' · ' : ''}${locSource}</div>
      </div></div>
      <button class="refresh" onclick="location.reload()" title="刷新">⟳</button>
    </div>
    <div class="clock-card"><div class="time" id="clock-time">--:--:--</div><div class="date" id="clock-date">----</div></div>
    <div class="main-card">
      <div class="icon">${iconFor(now.cond)}</div>
      <div class="cond">${now.cond}</div>
      <div class="temp">${Math.round(now.temp)}<sup>°</sup></div>
      <div class="range">最高 ${Math.round(now.tempMax)}° / 最低 ${Math.round(now.tempMin)}°</div>
    </div>
    <div class="grid">
      <div class="metric"><div class="m-icon">💧</div><div class="m-val">${now.humidity}%</div><div class="m-lab">湿度</div></div>
      <div class="metric"><div class="m-icon">💨</div><div class="m-val">${now.wind}</div><div class="m-lab">风力</div></div>
      <div class="metric"><div class="m-icon">🌡️</div><div class="m-val">${Math.round(now.feels)}°</div><div class="m-lab">体感</div></div>
      <div class="metric"><div class="m-icon">👁️</div><div class="m-val">${now.vis}</div><div class="m-lab">能见度</div></div>
    </div>
    ${hours.length?`
    <div class="section-title">🕐 未来 24 小时</div>
    <div class="hours">
      ${hours.map(h=>`
        <div class="hour"><div class="h-time">${h.time}</div><div class="h-icon">${iconFor(h.icon)}</div><div class="h-temp">${Math.round(h.temp)}°</div></div>`).join('')}
    </div>`:''}
    <div class="section-title">📅 未来 7 天</div>
    <div class="days">
      ${days.map((d,i)=>{
        const left = maxT>minT ? ((d.min-minT)/(maxT-minT)*100) : 0;
        const width = maxT>minT ? ((d.max-d.min)/(maxT-minT)*100) : 20;
        return `
        <div class="day">
          <div class="d-name">${i===0?'今天':d.week}</div>
          <div class="d-icon">${iconFor(d.icon)}</div>
          <div class="d-temp">${Math.round(d.min)}° / ${Math.round(d.max)}°</div>
          <div class="d-bar"><i style="left:${left}%;width:${width+30}%"></i></div>
        </div>`;
      }).join('')}
    </div>
    <div class="foot">定位：高德地图 · 天气：中国气象局（weatherInfo）<br>${dataSource||''} · 更新于 ${new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</div>
    ${!AMAP_WEB_KEY?`<div class="foot" style="color:#ffd;opacity:.85;">💡 提示：填入「Web 服务 Key」可启用 weatherInfo?extensions=all 精准数据</div>`:''}
  `;
  document.getElementById('app').innerHTML = html;
  bindClock();    // 时钟/日期节点被重建后，立即重绑并刷新一次（定时器仍在运行）
}

/* ============ 网络 ============ */
function withProxy(url){
  if(CORS_PROXY && /^https?:\/\//.test(url) && !url.includes(location.hostname))
    return CORS_PROXY + encodeURIComponent(url);
  return url;
}
async function fetchJSON(url, retry=1){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 8000);   // 缩短超时，快速失败走缓存/IP兜底
  try {
    const res = await fetch(withProxy(url));
    clearTimeout(t);
    if(!res.ok) throw new Error('http '+res.status);
    return await res.json();
  } catch(e){
    clearTimeout(t);
    if(retry>0) return fetchJSON(url, retry-1);
    throw e;
  }
}
async function fetchText(url){
  try { const res = await fetch(withProxy(url)); return res.ok ? (await res.text()).trim() : ''; }
  catch(e){ return ''; }
}

/* ============ 天气数据（三源兜底）============
 * ① 高德 Web 服务 weatherInfo?extensions=all：中国气象局数据，传 adcode 最精准，
 *    一次返回 实况(lives) + 未来3天预报(forecasts.casts)，含逐小时级预报字段。
 * ② 高德 JS API AMap.Weather：Web 服务不可用时降级（同一数据，JS 端调用）。
 * ③ wttr.in：最终兜底，补充 24 小时逐小时 + 第4天起的预报。
 */

// 通用：由「某天 Date + 天气数据」生成统一结构，星期基于真实日期动态推算（跨天自动正确）
const WEEK_NAMES = ['周日','周一','周二','周三','周四','周五','周六'];
function dayLabel(d, i){
  // i===0 始终表示“今天”，其余按真实日期算星期，避免缓存/跨天后错标
  if(i===0) return '今天';
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(d); target.setHours(0,0,0,0);
  const diff = Math.round((target-today)/86400000);
  if(diff===1) return '明天';
  if(diff===2) return '后天';
  return WEEK_NAMES[target.getDay()];
}
function buildDays(list){
  // list: [{date:Date|string, icon, cond, max, min}, ...]
  const today = new Date(); today.setHours(0,0,0,0);
  return list.map((c,i)=>{
    let dateObj;
    if(c.date instanceof Date) dateObj = c.date;
    else { const t = Date.parse(c.date); dateObj = isNaN(t)? new Date(Date.now()+i*86400000) : new Date(t); }
    dateObj.setHours(0,0,0,0);
    return {
      week: dayLabel(dateObj, i),
      icon: iconFor(c.icon||c.cond), cond: c.cond||'',
      max: parseFloat(c.max), min: parseFloat(c.min), date: c.date,
    };
  });
}

// 通用：高德天气现象 → 统一结构
function parseAmap({live, casts}){
  const wk=['周日','周一','周二','周三','周四','周五','周六'];
  const now = {
    cond: live.weather, icon: iconFor(live.weather),
    temp: parseFloat(live.temperature), feels: parseFloat(live.temperature),
    humidity: live.humidity, wind: (live.windpower||'')+'级 '+(live.winddirection||''), vis: live.reporttime?'—':'—',
    tempMax: parseFloat(casts[0].daytemp), tempMin: parseFloat(casts[0].nighttemp),
    reportTime: live.reporttime,
  };
  // casts: [今天, 明天, 后天]（extensions=all 返回3天预报）
  const dayList = casts.map((c,i)=>({
    date: c.date, icon: c.dayweather||c.nightweather, cond: c.dayweather||c.nightweather,
    max: parseFloat(c.daytemp), min: parseFloat(c.nighttemp),
  }));
  const days = buildDays(dayList);
  // 高德 forecasts.casts 含 dayweather/nightweather，可构造粗略逐小时（白天/夜间两段）
  const hours = buildHoursFromCasts(casts);
  return { now, days, hours, source:'高德天气(Web服务)' };
}

// 由白天/夜间天气拼出近似逐小时（高德免费版无真正逐小时，用 day/night 插值）
function buildHoursFromCasts(casts){
  const out=[];
  const today = casts[0];
  if(!today) return out;
  const max=parseFloat(today.daytemp), min=parseFloat(today.nighttemp);
  for(let h=0;h<24;h++){
    const isDay = h>=6 && h<18;
    const cond = isDay ? (today.dayweather||today.nightweather) : (today.nightweather||today.dayweather);
    // 温度按正弦曲线在 最低(凌晨)~最高(午后) 之间插值
    const t = min + (max-min) * Math.max(0, Math.sin((h-6)/12*Math.PI));
    out.push({ time:`${String(h).padStart(2,'0')}:00`, temp: Math.round(t), icon: iconFor(cond) });
  }
  return out;
}

/* ---- ① 优先：Web 服务 weatherInfo?extensions=all（用 adcode 最精准）---- */
async function fetchByWebService(){
  if(!AMAP_WEB_KEY) throw new Error('未配置 Web 服务 Key');
  // city 优先用 adcode（精确到区县），其次区县名/城市名
  const city = CURRENT_ADCODE || CURRENT_DISTRICT || CURRENT_CITY || '110000';
  const url = `${WEATHER_API}?key=${encodeURIComponent(AMAP_WEB_KEY)}&city=${encodeURIComponent(city)}&extensions=all&output=JSON`;
  const j = await fetchJSON(url);
  if(j.status!=='1' || (!j.lives&&!j.forecasts)) throw new Error('weatherInfo 返回异常: '+ (j.info||j.status));
  const live = (j.lives&&j.lives[0]) || buildLiveFromCast(j.forecasts[0].casts[0]);
  return parseAmap({ live, casts: j.forecasts[0].casts });
}
// Web 服务有时 lives 为空（无实况权限时），用当天 cast 顶替
function buildLiveFromCast(c){
  return { weather:c.dayweather, temperature:c.daytemp, humidity:'—', winddirection:'', windpower:'', reporttime:'' };
}

/* ---- ② 降级：高德 JS API AMap.Weather（城市名查询）---- */
function fetchByJsApi(){
  const cityKey = CURRENT_DISTRICT || CURRENT_CITY || '北京';
  return new Promise((resolve, reject)=>{
    if(typeof AMap==='undefined'||!AMap.Weather) { reject(new Error('AMap.Weather 未加载')); return; }
    AMap.plugin('AMap.Weather', ()=>{
      const weather = new AMap.Weather();
      weather.getLive(cityKey, (err, live)=>{
        if(err||!live) { reject(new Error('实时天气失败')); return; }
        weather.getForecast(cityKey, (e2, fc)=>{
          if(e2||!fc||!fc.casts) { reject(new Error('预报失败')); return; }
          resolve(parseAmap({live, casts:fc.casts}));
        });
      });
    });
  });
}

// ③ wttr.in 兜底（含真正 24 小时 + 7 天）
async function fetchWeatherFallback(lat, lon){
  const base = `${lat.toFixed(2)},${lon.toFixed(2)}`;
  const j = await fetchJSON(`https://wttr.in/${base}?format=j1`);
  const cur = j.current_condition[0];
  const today = j.weather[0];
  const now = {
    cond: cur.weatherDesc[0].value, icon: iconFor(cur.weatherDesc[0].value),
    temp: parseFloat(cur.temp_C), feels: parseFloat(cur.FeelsLikeC),
    humidity: cur.humidity, wind: cur.windspeedKmph+' km/h', vis: cur.visibility+' km',
    tempMax: parseFloat(today.maxtempC), tempMin: parseFloat(today.mintempC),
  };
  const hours = j.weather.slice(0,2).flatMap(w=>w.hourly).slice(0,24).map(h=>{
    const tt = String(h.time).padStart(4,'0');
    return { time:`${tt.slice(0,2)}:00`, temp:parseFloat(h.tempC), icon:iconFor(String(h.weatherCode)) };
  });
  // 7 天预报：基于真实日期动态推算星期（今天/明天/后天 + 星期），跨天自动正确
  const dayList = j.weather.map((w,i)=>({
    date: new Date(Date.now()+i*86400000),
    icon: w.hourly[4].weatherCode, cond: '', max: parseFloat(w.maxtempC), min: parseFloat(w.mintempC),
  }));
  const days = buildDays(dayList);
  return { now, hours, days, source:'wttr.in（兜底）' };
}

// 对外入口：Web 服务 → JS API → wttr 三级兜底
async function fetchWeather(lat, lon){
  const tries=[];
  if(AMAP_WEB_KEY) tries.push(['Web服务', ()=>fetchByWebService()]);
  tries.push(['JS_API', ()=>fetchByJsApi()]);
  for(const [name, fn] of tries){
    try { const data = await fn(); return { ...data, dataSource: data.source }; }
    catch(e){ console.warn(`[${name} 失败]`, e.message); }
  }
  // 全部失败 → wttr 兜底（补充真正逐小时）
  const fb = await fetchWeatherFallback(lat, lon);
  return { ...fb, dataSource: fb.source };
}

/* ============ 高德定位 ============ */
function waitForAMap(timeout=8000){
  return new Promise((resolve, reject)=>{
    if(typeof AMap!=='undefined'){ resolve(); return; }
    const t=setTimeout(()=>reject(new Error('高德加载超时')), timeout);
    const timer=setInterval(()=>{
      if(typeof AMap!=='undefined'){ clearInterval(timer); clearTimeout(t); resolve(); }
    }, 80);
  });
}

function amapLocate(){
  return new Promise(async (resolve, reject)=>{
    try { await waitForAMap(); } catch(e){ reject(e); return; }
    AMap.plugin(['AMap.Geolocation','AMap.Geocoder','AMap.CitySearch'], ()=>{
      const geolocation = new AMap.Geolocation({ enableHighAccuracy:true, timeout:8000, noIpLocate:0, GeoLocationFirst:true });

      const geocode = coord => new Promise(res=>{
        const geocoder = new AMap.Geocoder();
        geocoder.getAddress(coord, (status, result)=>{
          let address='';
          if(status==='complete'&&result.regeocode){
            const a=result.regeocode.addressComponent;
            // 记录精确区县/城市/adcode，用于高德天气精准查询（adcode 最精准）
            CURRENT_DISTRICT = a.district || '';
            CURRENT_CITY = a.city || a.province || '';
            CURRENT_ADCODE = a.adcode || '';
            address=[CURRENT_CITY, CURRENT_DISTRICT].filter(Boolean).join('，');
            if(!address) address=result.regeocode.formattedAddress||'';
          }
          res(address);
        });
      });

      geolocation.getCurrentPosition(async (status, result)=>{
        if(status==='complete'&&result.position){
          const coord=[result.position.getLng(), result.position.getLat()];
          resolve({ coord, src:'GPS定位', address: await geocode(coord) });
        } else {
          // GPS 失败 -> 高德 IP 定位（CitySearch 极快，约 200ms）
          const citySearch=new AMap.CitySearch();
          citySearch.getLocalCity(async (st, res)=>{
            if(st==='complete'&&res.center){
              const coord=[res.center.getLng(), res.center.getLat()];
              CURRENT_CITY = res.city || res.province || '';
              resolve({ coord, src:'IP定位', address:(await geocode(coord))||(CURRENT_CITY) });
            } else reject(new Error('定位失败'));
          });
        }
      });
    });
  });
}

/* ============ 主流程 ============ */
async function main(){
  // ① 立即用缓存渲染（若有），用户瞬间看到数据
  const cached = cache.get();
  if (cached) render(cached);

  // ② 后台重新定位 + 拉取最新数据
  let coord=null, locSource='自动定位', address='';
  try {
    const r = await amapLocate();
    coord={ lat:r.coord[1], lon:r.coord[0], src:r.src };
    address=r.address; locSource=r.src;
  } catch(e){ console.warn(e); }

  if(!coord){ coord={ lat:39.9042, lon:116.4074, src:'默认' }; }

  try {
    const data = await fetchWeather(coord.lat, coord.lon);
    const finalLoc = address || CURRENT_CITY || `${coord.lat.toFixed(2)}, ${coord.lon.toFixed(2)}`;
    const full = { ...data, loc:finalLoc, locSource, dataSource: data.dataSource };
    render(full);
    cache.set(full);   // ③ 成功后写缓存，下次秒开
  } catch(e){
    if(!cached) renderError('无法获取天气数据，请检查网络后重试。');
    // 有缓存时不弹错，静默保留旧数据
  }
}

function renderError(msg){
  document.getElementById('app').innerHTML = `<div style="text-align:center;padding:60px 20px;opacity:.9;">⚠️ ${msg}<br><button onclick="location.reload()" style="margin-top:16px;padding:10px 24px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:#fff;cursor:pointer;">重试</button></div>`;
}

startClock();   // 骨架屏阶段就启动时钟，零等待看到时间
main().catch(()=>{});
</script>
