<style>
:root{
  --t:.3s cubic-bezier(.4,0,.2,1);
  --r:8px;
  --maxw:1080px;
  --bg:#f4f6f9;
  --header-bg:#1a3a5c;
  --header-bg2:#0f2744;
  --header-text:#fff;
  --accent:#c8161d;
  --surface:#fff;
  --surface-hover:#f0f4fa;
  --border:#d8dde4;
  --text:#1a2a3a;
  --text-muted:#657584;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --shadow-lg:0 4px 16px rgba(0,0,0,.08),0 8px 32px rgba(0,0,0,.04);
  --divider:#e2e6ec;
  --icon-bg:#eef3f9;
  --icon-text:#1a3a5c;
  --mark-bg:rgba(200,22,29,.14);
}
[data-theme="dark"]{
  --bg:#121a28;
  --header-bg:#0a1e36;
  --header-bg2:#061326;
  --header-text:#e8edf4;
  --accent:#e0444a;
  --surface:#182238;
  --surface-hover:#1f2e48;
  --border:#243349;
  --text:#e2e8f0;
  --text-muted:#8a9ab0;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.2);
  --shadow-lg:0 4px 20px rgba(0,0,0,.35),0 8px 40px rgba(0,0,0,.2);
  --divider:#1e3048;
  --icon-bg:#1a2c44;
  --icon-text:#93b4e8;
  --mark-bg:rgba(224,68,74,.28);
}
@media(prefers-color-scheme:dark){
  [data-theme="auto"]{
    --bg:#121a28;--header-bg:#0a1e36;--header-bg2:#061326;
    --header-text:#e8edf4;--accent:#e0444a;
    --surface:#182238;--surface-hover:#1f2e48;
    --border:#243349;--text:#e2e8f0;--text-muted:#8a9ab0;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.2);
    --shadow-lg:0 4px 20px rgba(0,0,0,.35),0 8px 40px rgba(0,0,0,.2);
    --divider:#1e3048;--icon-bg:#1a2c44;--icon-text:#93b4e8;
    --mark-bg:rgba(224,68,74,.28);
  }
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background var(--t),color var(--t);font-size:15px;line-height:1.6;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
img,svg{max-width:100%}
mark{background:var(--mark-bg);color:inherit;border-radius:3px;padding:0 1px;font-weight:600}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ===== 顶栏 ===== */
.topbar{
  background:linear-gradient(135deg,var(--header-bg) 0%,var(--header-bg2) 100%);
  border-bottom:3px solid var(--accent);position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,.15);
  padding-top:env(safe-area-inset-top);
}
.topbar-inner{
  max-width:var(--maxw);margin:0 auto;padding:12px 24px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.logo{display:flex;align-items:center;gap:14px;flex:0 0 auto}
.logo-mark{
  width:40px;height:40px;border-radius:8px;background:var(--accent);
  display:grid;place-items:center;color:#fff;font-size:1.15rem;font-weight:700;
  box-shadow:0 2px 8px rgba(200,22,29,.35);transition:transform var(--t),filter var(--t);
}
a.logo-mark:hover{transform:translateY(-1px);filter:brightness(1.08)}
a.logo-mark:focus-visible{outline:2px solid #fff;outline-offset:2px}
.logo-text{color:var(--header-text);font-size:1.15rem;font-weight:700;letter-spacing:.04em;line-height:1.25}
.logo-sub{color:rgba(255,255,255,.55);font-size:.68rem;margin-top:2px;letter-spacing:.12em}

/* 搜索框 */
.search{position:relative;flex:1 1 200px;max-width:340px;margin-left:auto;min-width:0}
.search .si{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;pointer-events:none;opacity:.65;
}
.search input{
  width:100%;padding:9px 34px 9px 33px;border-radius:var(--r);
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.09);
  color:var(--header-text);font-size:.85rem;line-height:1.4;outline:none;
  transition:background var(--t),border-color var(--t),box-shadow var(--t);
}
.search input::placeholder{color:rgba(255,255,255,.48)}
.search input:focus{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.42);box-shadow:0 0 0 3px rgba(255,255,255,.09)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border:0;border-radius:50%;background:transparent;
  color:var(--header-text);opacity:.55;font-size:15px;line-height:1;display:none;
}
.search .clear:hover{opacity:1;background:rgba(255,255,255,.14)}
.search.has-val .clear{display:block}

/* 主题按钮 */
.theme-btn{
  display:flex;align-items:center;gap:6px;padding:8px 14px;min-height:38px;
  border:1px solid rgba(255,255,255,.2);border-radius:var(--r);
  background:rgba(255,255,255,.08);color:var(--header-text);font-size:.82rem;
  transition:background var(--t),border-color var(--t);white-space:nowrap;flex:0 0 auto;
}
.theme-btn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35)}
.theme-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.theme-btn .dot{width:7px;height:7px;border-radius:50%;background:#4cd964;box-shadow:0 0 6px #4cd964;transition:all var(--t);flex:0 0 auto}
.theme-btn[data-mode="light"] .dot{background:#ffd60a;box-shadow:0 0 6px #ffd60a}
.theme-btn[data-mode="dark"] .dot{background:#5e5ce6;box-shadow:0 0 6px #5e5ce6}

/* ===== 主容器 ===== */
.wrap{max-width:var(--maxw);margin:0 auto;padding:30px 24px 60px}

/* 分类 */
.cat{margin-bottom:30px}
.cat-head{
  display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:10px;
  border-bottom:1px solid var(--divider);
}
.cat-bar{width:4px;height:20px;border-radius:2px;background:var(--accent);flex-shrink:0}
.cat-title{font-size:1.05rem;font-weight:700;color:var(--text);letter-spacing:.02em}
.cat-count{font-size:.74rem;color:var(--text-muted);background:rgba(0,0,0,.04);padding:2px 10px;border-radius:20px;margin-left:4px;white-space:nowrap}
[data-theme="dark"] .cat-count{background:rgba(255,255,255,.06)}

/* 网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}

/* 链接卡片 */
.link{
  display:flex;align-items:center;gap:14px;padding:13px 16px;min-height:72px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  transition:background var(--t),border-color var(--t),transform var(--t),box-shadow var(--t);
  position:relative;overflow:hidden;box-shadow:var(--shadow);
  -webkit-user-drag:none;user-select:none;
}
.link::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent);transform:scaleY(0);transition:transform var(--t);transform-origin:center;
}
.link:hover{background:var(--surface-hover);border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.link:hover::before{transform:scaleY(1)}
.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link:active{transform:scale(.985)}

.icon{
  width:38px;height:38px;border-radius:8px;background:var(--icon-bg);color:var(--icon-text);
  display:grid;place-items:center;font-size:.82rem;font-weight:700;flex-shrink:0;
  transition:background var(--t),color var(--t),border-color var(--t);
  border:1px solid var(--border);overflow:hidden;letter-spacing:0;padding:0 3px;
}
.icon.ic-sm{font-size:.68rem}
.icon.ic-xs{font-size:.58rem;letter-spacing:-.03em}
.link:hover .icon{background:var(--accent);color:#fff;border-color:var(--accent)}

.link-body{min-width:0;flex:1}
.link-name{
  font-size:.94rem;font-weight:500;color:var(--text);line-height:1.35;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
  overflow:hidden;word-break:break-word;transition:color var(--t);
}
.link:hover .link-name{color:var(--accent)}
.link-desc{
  font-size:.76rem;color:var(--text-muted);line-height:1.4;margin-top:3px;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
  overflow:hidden;word-break:break-word;
}
.arrow{color:var(--text-muted);font-size:.8rem;transition:opacity var(--t),transform var(--t),color var(--t);opacity:0;transform:translateX(-4px);flex:0 0 auto}
.link:hover .arrow{opacity:1;transform:translateX(0);color:var(--accent)}

/* 空结果 */
.empty{text-align:center;padding:56px 20px;color:var(--text-muted)}
.empty .ei{font-size:2rem;line-height:1;margin-bottom:14px;opacity:.75}
.empty p{font-size:.92rem}
.empty b{color:var(--text);font-weight:600}
.empty .btn-reset{
  margin-top:18px;padding:8px 20px;border-radius:var(--r);
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  font-size:.84rem;transition:background var(--t),border-color var(--t),color var(--t);
}
.empty .btn-reset:hover{border-color:var(--accent);color:var(--accent);background:var(--surface-hover)}

/* 返回顶部 */
.to-top{
  position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;z-index:90;
  background:var(--surface);color:var(--text);border:1px solid var(--border);
  box-shadow:var(--shadow-lg);font-size:1rem;line-height:1;
  opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity var(--t),visibility var(--t),transform var(--t),border-color var(--t),color var(--t);
}
.to-top.show{opacity:1;visibility:visible;transform:translateY(0)}
.to-top:hover{border-color:var(--accent);color:var(--accent)}

/* 页脚 */
footer{
  border-top:1px solid var(--divider);padding:20px 24px calc(20px + env(safe-area-inset-bottom));
  text-align:center;color:var(--text-muted);font-size:.76rem;background:var(--surface);margin-top:40px;
}
footer a:hover{color:var(--accent)}

/* ===== 响应式 ===== */
@media(max-width:760px){
  .wrap{padding:22px 16px 48px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
}
@media(max-width:640px){
  .topbar-inner{padding:10px 14px;gap:10px}
  .logo{gap:11px}
  .logo-mark{width:36px;height:36px;font-size:1.05rem}
  .logo-text{font-size:1.02rem}
  .logo-sub{display:none}
  .search{order:3;flex:1 1 100%;max-width:none;margin-left:0}
  .search input{font-size:16px;padding:10px 36px 10px 34px}
  .theme-btn{padding:8px 12px;font-size:.78rem}
  .cat{margin-bottom:24px}
  .link{padding:13px 15px;min-height:70px;gap:13px}
  .to-top{right:12px;bottom:calc(12px + env(safe-area-inset-bottom))}
}
/* 窄屏改单列，彻底避免文字被挤断 */
@media(max-width:560px){
  .wrap{padding:18px 14px 44px}
  .grid{grid-template-columns:1fr;gap:10px}
  .link{min-height:0;padding:14px 15px}
  .link-name{font-size:.95rem}
  .icon{width:40px;height:40px}
}
@media(max-width:360px){
  .logo-text{font-size:.95rem}
  .link{padding:12px 13px;gap:11px}
  .icon{width:36px;height:36px}
}
/* 触屏：去掉"粘住的 hover" */
@media(hover:none){
  .link:hover{background:var(--surface);border-color:var(--border);transform:none;box-shadow:var(--shadow)}
  .link:hover::before{transform:scaleY(0)}
  .link:hover .icon{background:var(--icon-bg);color:var(--icon-text);border-color:var(--border)}
  .link:hover .link-name{color:var(--text)}
  .arrow{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}
</style>

    {name:"中国知网", url:"https://www.cnki.net", icon:"知", desc:"学术文献检索"},
    {name:"万方", url:"https://www.wanfangdata.com.cn/", icon:"万", desc:"学术文献检索"},
    {name:"Web of Science", url:"https://www.webofscience.com/", icon:"W", desc:"英文学术文献检索"},
    {name:"Z-library", url:"https://zh.101entp.ru/profile/45089794/bff853", icon:"Z", desc:"电子书下载"},
    {name:"智慧教育", url:"https://www.smartedu.cn/", icon:"W", desc:"国家智慧教育平台"},
    {name:"MOOC", url:"https://www.icourse163.org/", icon:"M", desc:"中国大学 MOOC"},
    {name:"学堂在线", url:"https://www.xuetangx.com/", icon:"X", desc:"清华大学在线教育平台"},
    {name:"YouTube", url:"https://www.youtube.com", icon:"Y", desc:"全球视频分享"},
  ]},
  {cat:"其他链接", links:[
    {name:"山东科协", url:"https://www.sdast.org.cn/", icon:"S", desc:"山东省科学技术协会官网"},
    {name:"北京大学", url:"https://www.pku.edu.cn/", icon:"B", desc:"北京大学官网"},
    {name:"北大生科", url:"https://www.bio.pku.edu.cn/", icon:"B", desc:"北京大学生命科学学院官网"},
    {name:"国家标准公开", url:"https://openstd.samr.gov.cn/", icon:"G", desc:"国家标准公开查询平台"},
    {name:"数学竞赛网", url:"https://www.cmathc.org.cn/", icon:"M", desc:"全国大学生数学竞赛网"},
    {name:"生命科学竞赛", url:"https://culsc.cn/", icon:"B", desc:"全国大学生生命科学竞赛"},
  ]},
];

/* ========== 工具函数 ========== */

// HTML 实体转义 —— 防 XSS
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 搜索命中高亮（先转义再套 mark，保证不破坏标签）
const rxEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function highlight(text, q){
  const safe = esc(text);
  if(!q) return safe;
  const sq = esc(q);
  if(!sq) return safe;
  try { return safe.replace(new RegExp(rxEsc(sq), 'gi'), m => '<mark>' + m + '</mark>'); }
  catch(_){ return safe; }
}

// 图标字数多时自动缩小字号
const iconCls = s => { const n = String(s == null ? '' : s).length; return n > 3 ? ' ic-xs' : n > 2 ? ' ic-sm' : ''; };

// URL 安全校验 —— 三层防御
const BLOCKED = /^(javascript|data|blob|vbscript|file|about|chrome|chrome-extension):/i;
const safeUrl = u => {
  try {
    const raw = String(u).trim();
    if (BLOCKED.test(raw)) return '#blocked';
    const p = new URL(raw, document.baseURI || window.location.href);
    if (!['http:','https:','mailto:','tel:'].includes(p.protocol)) return '#blocked';
    if (!/^[a-z0-9.\-_]+$/i.test(p.hostname)) return '#blocked';
    return p.href;
  } catch { return '#blocked'; }
};

/* ========== 渲染 ========== */
const app = document.getElementById('app');

function render(query){
  const q = (query || '').trim().toLowerCase();
  let total = 0;
  const parts = [];

  DATA.forEach(section => {
    const links = section.links.filter(l => !q || [
      l.name, l.desc, l.icon, section.cat
    ].some(f => String(f || '').toLowerCase().includes(q)));

    total += links.length;
    if (!links.length) return;

    parts.push(`<section class="cat">
      <div class="cat-head">
        <div class="cat-bar" aria-hidden="true"></div>
        <span class="cat-title">${highlight(section.cat, q)}</span>
        <span class="cat-count">${links.length} 项</span>
      </div>
      <div class="grid">
        ${links.map(l => {
          const u = safeUrl(l.url);
          const icon = `<span class="icon${iconCls(l.icon)}">${esc(l.icon || '?')}</span>`;
          const body = `<div class="link-body">
                <div class="link-name">${highlight(l.name || '未知', q)}</div>
                <div class="link-desc">${highlight(l.desc || '', q)}</div>
              </div>`;
          const title = esc((l.name || '') + (l.desc ? ' · ' + l.desc : ''));
          return u && u !== '#blocked'
            ? `<a class="link" href="${u}" target="_blank" rel="noopener noreferrer" draggable="false" title="${title}">${icon}${body}<span class="arrow" aria-hidden="true">→</span></a>`
            : `<div class="link" style="opacity:.45;cursor:not-allowed" aria-disabled="true" title="链接已被安全策略拦截">${icon}${body}<span class="arrow" aria-hidden="true">⚠</span></div>`;
        }).join('')}
      </div>
    </section>`);
  });

  app.innerHTML = total
    ? parts.join('')
    : `<div class="empty">
         <div class="ei" aria-hidden="true">🔍</div>
         <p>没有找到与「<b>${esc(query)}</b>」匹配的链接</p>
         <button class="btn-reset" type="button">清除搜索</button>
       </div>`;
}

try {
  if (!Array.isArray(DATA)) throw new Error('DATA 必须是数组');
  DATA.forEach((s, i) => {
    if (typeof s.cat !== 'string') throw new Error(`分类[${i}] cat 字段缺失`);
    if (!Array.isArray(s.links)) throw new Error(`分类[${i}] links 字段缺失`);
  });
  render('');
} catch(e) {
  console.error('[渲染错误]', e);
  app.innerHTML = `<div style="text-align:center;padding:60px;color:var(--accent)">⚠️ 数据格式错误：${esc(e.message)}</div>`;
}

/* ========== 搜索过滤 ========== */
const box    = document.getElementById('searchBox');
const input  = document.getElementById('searchInput');
const clear  = document.getElementById('searchClear');
let timer = null;

function applySearch(v){
  box.classList.toggle('has-val', !!v);
  render(v);
}

input.addEventListener('input', e => {
  const v = e.target.value;
  box.classList.toggle('has-val', !!v);
  clearTimeout(timer);
  timer = setTimeout(() => render(v), 60);
});

clear.addEventListener('click', () => {
  input.value = '';
  applySearch('');
  input.focus();
});

// 空结果里的"清除搜索"
app.addEventListener('click', e => {
  if (e.target.closest('.btn-reset')) { input.value = ''; applySearch(''); input.focus(); }
});

// 按 / 或 Ctrl+K 快速定位搜索框；Esc 清空
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); input.focus(); input.select(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); input.focus(); input.select(); return; }
  if (e.key === 'Escape' && document.activeElement === input) { input.value = ''; applySearch(''); input.blur(); }
});

/* ========== 主题管理 ========== */
const STORAGE_KEY = 'nav-theme';
const THEMES = [
  {id:'auto',  label:'跟随系统', c:'#4cd964', chrome:'#1a3a5c'},
  {id:'light', label:'浅色模式', c:'#ffd60a', chrome:'#1a3a5c'},
  {id:'dark',  label:'深色模式', c:'#5e5ce6', chrome:'#0a1e36'},
];
const btn  = document.getElementById('themeBtn');
const lbl  = btn.querySelector('.lbl');
const dot  = btn.querySelector('.dot');
const metaColor = document.getElementById('themeColor');
const mq = window.matchMedia('(prefers-color-scheme: dark)');

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  btn.setAttribute('data-mode', t);
  const cfg = THEMES.find(x => x.id === t) || THEMES[0];
  lbl.textContent = cfg.label;
  btn.setAttribute('aria-label', '切换主题（当前：' + cfg.label + '）');
  btn.setAttribute('title', '当前：' + cfg.label + ' · 点击切换');
  dot.style.cssText = `background:${cfg.c};box-shadow:0 0 6px ${cfg.c}`;
  // 浏览器地址栏配色：auto 跟随系统实际深浅色
  if (metaColor) metaColor.setAttribute('content', (t === 'dark' || (t === 'auto' && mq.matches)) ? '#0a1e36' : '#1a3a5c');
}

btn.addEventListener('click', () => {
  const order = THEMES.map(x => x.id);
  const cur = document.documentElement.getAttribute('data-theme') || 'auto';
  const next = order[(order.indexOf(cur) + 1) % order.length];
  applyTheme(next);
  try { localStorage.setItem(STORAGE_KEY, next); } catch(_) {}
});

// 初始化（localStorage 不可用时静默降级为 auto）
let saved = null;
try { saved = localStorage.getItem(STORAGE_KEY); } catch(_) {}
applyTheme(saved && THEMES.some(x => x.id === saved) ? saved : 'auto');

// 系统主题变化响应
const onScheme = () => { if ((document.documentElement.getAttribute('data-theme') || 'auto') === 'auto') applyTheme('auto'); };
if (mq.addEventListener) mq.addEventListener('change', onScheme);
else if (mq.addListener) mq.addListener(onScheme);

/* ========== 返回顶部 ========== */
const toTop = document.getElementById('toTop');
let ticking = false;
function onScroll(){
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    toTop.classList.toggle('show', window.scrollY > 400);
    ticking = false;
  });
}
window.addEventListener('scroll', onScroll, {passive: true});
onScroll();
toTop.addEventListener('click', () => {
  window.scrollTo({top: 0, behavior: 'smooth'});
});
</script>
