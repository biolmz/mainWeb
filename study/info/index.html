<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教程目录</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
  <rect width='100' height='100' rx='20' fill='%230d47a1'/>
  <path d='M30 20 Q50 35 70 20 Q50 50 30 80 Q50 65 70 80 Q50 50 30 20 Z'
        fill='none' stroke='%234caf50' stroke-width='6' stroke-linecap='round'/>
  <circle cx='30' cy='20' r='5' fill='%2381c784'/>
  <circle cx='70' cy='20' r='5' fill='%2381c784'/>
  <circle cx='30' cy='80' r='5' fill='%2381c784'/>
  <circle cx='70' cy='80' r='5' fill='%2381c784'/>
</svg>">
    <style>
        /* ---------- 极简框架样式 (仅用于基础布局，无多余装饰) ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: #1e1e1e;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        /* 简单框架：一个带边框的容器 */
        .catalog {
            max-width: 820px;
            width: 100%;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 28px 30px;
            background: #fafbfc;
        }

        /* 标题 */
        .catalog h1 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e1e4e8;
            color: #111;
        }

        /* 列表容器 */
        .catalog ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* 每个条目：极简分隔线 */
        .catalog li {
            padding: 12px 0;
            border-bottom: 1px solid #eaeef2;
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 6px 12px;
        }

        .catalog li:last-child {
            border-bottom: none;
        }

        /* a 标签：标准链接样式，无多余特效 */
        .catalog a {
            color: #0969da;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            word-break: break-word;
        }

        .catalog a:hover {
            text-decoration: underline;
        }

        
        /* 移动端小调整 */
        @media (max-width: 600px) {
            .catalog {
                padding: 18px 16px;
            }
            .catalog li {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .catalog .url-path {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <div class="catalog">
        <h1>📘 生信教程 · 目录</h1>
        <ul>
            <!-- 1. R_ggplot2教程 -->
            <li>

            </li>

            <li><a href="/study/info/生信入门教程.html" target="_blank">生信入门教程</a> </li>
            <li><a href="/study/info/Python 数据分析与可视化.html" target="_blank">Python 数据分析与可视化</a> </li>
            
        </ul>
    </div>

</body>
</html>
