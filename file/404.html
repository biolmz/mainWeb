<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 云端笔记系统</title>
    <script>
        // GitHub Pages SPA 重定向
        sessionStorage.setItem('redirectPath', location.pathname + location.search);
        var repoName = location.pathname.split('/')[1];
        location.replace('/' + repoName + '/');
    </script>
</head>
<body>
    <p style="text-align:center;padding:40px;font-family:sans-serif;color:#666">
        正在跳转...

</body>
