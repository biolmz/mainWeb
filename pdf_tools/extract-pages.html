<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>提取页面 — PDF 工具箱</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="extract-pages">
  <header class="site-header">
    <nav class="nav">
      <a class="nav-logo" href="index.html">
        <span class="logo-mark">P</span>
        <span>PDF 工具箱</span>
      </a>
      <div class="nav-links">
        <a href="index.html" data-page="home">首页</a>
        <a href="merge.html" data-page="merge">合并</a>
        <a href="split.html" data-page="split">拆分</a>
        <a href="extract-pages.html" data-page="extract-pages">提取页面</a>
        <a href="extract-text.html" data-page="extract-text">提取文字</a>
        <a href="ocr.html" data-page="ocr">OCR 识别</a>
        <a href="extract-images.html" data-page="extract-images">提取图片</a>
        <a href="compress.html" data-page="compress">压缩</a>
        <a href="convert.html" data-page="convert">转 Word/Excel</a>
        <a href="about.html" data-page="about">关于</a>
      </div>
    </nav>
  </header>

  <main>
    <div class="container">
      <div class="page-head">
        <div class="breadcrumb"><a href="index.html">首页</a> / 提取页面</div>
        <h1>📑 提取页面</h1>
        <p>从 PDF 中挑选指定页面组成新文件，支持按范围输入或可视化勾选。</p>
      </div>

      <div class="card">
        <div class="card-body">
          <div id="dropzone" class="dropzone">
            <div class="dz-icon">📥</div>
            <div class="dz-main">点击选择 或 拖拽 PDF 文件到这里</div>
            <div class="dz-sub">每次处理 1 个 PDF 文件</div>
            <input id="fileInput" type="file" accept="application/pdf,.pdf" class="hidden" />
          </div>

          <div id="configBox" class="hidden" style="margin-top: 20px;">
            <div class="fileInfo" style="margin-bottom: 14px;">
              <span class="badge-pill" id="fileBadge">📄 文件名</span>
              <span class="muted small" id="fileMeta" style="margin-left: 10px;"></span>
            </div>

            <div class="tabs">
              <button class="tab-btn active" data-tab="range">按范围输入</button>
              <button class="tab-btn" data-tab="pick">可视化勾选</button>
            </div>

            <div id="panel-range" class="tab-panel active">
              <div class="field">
                <label for="rangeInput">页码范围（从 1 开始）</label>
                <div class="form-row">
                  <input type="text" id="rangeInput" placeholder="例如：1-3,5,7-9 或 2,4,6" style="flex: 1; min-width: 220px;" />
                  <button id="extractRangeBtn" class="btn btn-primary">📑 提取为 PDF</button>
                </div>
                <div class="hint">支持单个页码与区间，用逗号分隔；提取出的页面会合并为单个 PDF 下载</div>
              </div>
            </div>

            <div id="panel-pick" class="tab-panel">
              <div class="result-toolbar" style="margin-bottom: 10px;">
                <div class="info" id="pickInfo">点击页面缩略图选择，可多选</div>
                <div style="display: flex; gap: 8px;">
                  <button id="selectAllBtn" class="btn btn-secondary btn-sm">全选</button>
                  <button id="clearBtn" class="btn btn-secondary btn-sm">清空</button>
                  <button id="extractPickBtn" class="btn btn-primary btn-sm">📑 提取所选</button>
                </div>
              </div>
              <div id="thumbGrid" class="page-grid" style="max-height: 460px; overflow: auto; padding: 4px;"></div>
            </div>
          </div>

          <div id="progressBox"></div>
          <div id="resultBox" class="hidden" style="margin-top: 18px;">
            <div class="result-toolbar">
              <div class="info" id="resultInfo"></div>
              <button id="dlBtn" class="btn btn-success btn-sm">⬇️ 下载提取的 PDF</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div>PDF 工具箱 · 纯前端本地处理</div>
      <span class="privacy-badge">🔒 本地处理，文件不上传</span>
    </div>
  </footer>

  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/pdf-utils.js"></script>
  <script>
    PDFTools.initNav("extract-pages");

    const fileInput = document.getElementById("fileInput");
    const dropzone = document.getElementById("dropzone");
    const configBox = document.getElementById("configBox");
    const fileBadge = document.getElementById("fileBadge");
    const fileMeta = document.getElementById("fileMeta");
    const rangeInput = document.getElementById("rangeInput");
    const extractRangeBtn = document.getElementById("extractRangeBtn");
    const extractPickBtn = document.getElementById("extractPickBtn");
    const selectAllBtn = document.getElementById("selectAllBtn");
    const clearBtn = document.getElementById("clearBtn");
    const thumbGrid = document.getElementById("thumbGrid");
    const pickInfo = document.getElementById("pickInfo");
    const progressBox = document.getElementById("progressBox");
    const resultBox = document.getElementById("resultBox");
    const resultInfo = document.getElementById("resultInfo");
    const dlBtn = document.getElementById("dlBtn");

    let pdfDoc = null;      // pdf.js 文档（渲染缩略图用）
    let libDoc = null;      // pdf-lib 文档（提取用）
    let currentFile = null;
    let totalPages = 0;
    let baseName = "output";
    let selected = new Set();
    let lastResult = null;  // { blob, name }

    const THUMB_SCALE = 0.32;
    const MAX_THUMBS = 120;

    /* ---- Tab 切换 ---- */
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
        if (btn.dataset.tab === "pick" && !thumbGrid.children.length && pdfDoc) {
          renderThumbs();
        }
      });
    });

    /* ---- 文件选择 ---- */
    PDFTools.setupDropzone(dropzone, fileInput, async (list) => {
      const f = list[0];
      if (!f) return;
      if (!PDFTools.isPdf(f)) { PDFTools.toast("请选择 PDF 文件", "warning"); return; }
      try {
        pdfDoc = await PdfUtils.openPdf(f);
        libDoc = await PdfUtils.loadPdfLibFile(f);
        currentFile = f;
        totalPages = pdfDoc.numPages;
        baseName = PDFTools.safeName(f.name.replace(/\.pdf$/i, ""));
        fileBadge.textContent = "📄 " + f.name;
        fileMeta.textContent = PDFTools.formatBytes(f.size) + " · 共 " + totalPages + " 页";
        configBox.classList.remove("hidden");
        resultBox.classList.add("hidden");
        lastResult = null;
        selected.clear();
        thumbGrid.innerHTML = "";

        if (totalPages > MAX_THUMBS) {
          pickInfo.textContent = "文件页数较多（" + totalPages + " 页），缩略图渲染较慢，建议使用「按范围输入」模式";
          renderThumbs(true); // 仅渲染前若干页作为示意
        } else {
          pickInfo.textContent = "点击页面缩略图选择，可多选";
          renderThumbs();
        }
        PDFTools.toast("已加载：" + f.name + "（" + totalPages + " 页）", "success");
      } catch (err) {
        pdfDoc = libDoc = null;
        PDFTools.toast("无法读取 PDF：" + (err.message || err), "error", 5000);
        console.error(err);
      }
    });

    /* ---- 渲染缩略图（懒加载） ---- */
    function renderThumbs(limitOnly = false) {
      thumbGrid.innerHTML = "";
      const count = limitOnly ? Math.min(20, totalPages) : totalPages;
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((en) => {
          if (en.isIntersecting && !en.target.dataset.loaded) {
            en.target.dataset.loaded = "1";
            renderOneThumb(parseInt(en.target.dataset.page, 10), en.target);
            observer.unobserve(en.target);
          }
        });
      }, { root: thumbGrid, rootMargin: "120px" });

      for (let p = 1; p <= count; p++) {
        const div = document.createElement("div");
        div.className = "page-thumb";
        div.dataset.page = p;
        div.innerHTML = '<div class="ph-empty">加载中…</div><div class="check">✓</div><div class="pnum">第 ' + p + ' 页</div>';
        div.addEventListener("click", () => toggleSelect(p, div));
        thumbGrid.appendChild(div);
        observer.observe(div);
      }
      if (limitOnly && totalPages > count) {
        const tip = document.createElement("div");
        tip.style.cssText = "grid-column: 1/-1; text-align:center; color: var(--text-muted); font-size: 12.5px; padding: 10px;";
        tip.textContent = "仅展示前 " + count + " 页示意，请优先使用「按范围输入」模式";
        thumbGrid.appendChild(tip);
      }
    }

    async function renderOneThumb(pageNum, container) {
      try {
        const { canvas } = await PdfUtils.renderPageToCanvas(pdfDoc, pageNum, THUMB_SCALE);
        const ph = container.querySelector(".ph-empty");
        if (ph) ph.replaceWith(canvas);
      } catch (e) {
        const ph = container.querySelector(".ph-empty");
        if (ph) ph.textContent = "渲染失败";
      }
    }

    function toggleSelect(pageNum, el) {
      if (selected.has(pageNum)) selected.delete(pageNum);
      else selected.add(pageNum);
      el.classList.toggle("selected", selected.has(pageNum));
      pickInfo.textContent = "已选择 " + selected.size + " 页";
    }

    selectAllBtn.addEventListener("click", () => {
      const count = Math.min(totalPages, MAX_THUMBS);
      selected.clear();
      for (let p = 1; p <= count; p++) selected.add(p);
      thumbGrid.querySelectorAll(".page-thumb").forEach((el) => el.classList.add("selected"));
      pickInfo.textContent = "已选择 " + selected.size + " 页";
    });

    clearBtn.addEventListener("click", () => {
      selected.clear();
      thumbGrid.querySelectorAll(".page-thumb").forEach((el) => el.classList.remove("selected"));
      pickInfo.textContent = "点击页面缩略图选择，可多选";
    });

    /* ---- 提取逻辑 ---- */
    async function extractPages(pageNumbers, label) {
      if (!pageNumbers.length) { PDFTools.toast("请先选择要提取的页面", "warning"); return; }
      extractRangeBtn.disabled = extractPickBtn.disabled = true;
      const prog = PDFTools.showProgress(progressBox, "正在提取 " + pageNumbers.length + " 页…");
      try {
        const doc = await PDFLib.PDFDocument.create();
        const idxs = pageNumbers.map((p) => p - 1);
        const copied = await doc.copyPages(libDoc, idxs);
        copied.forEach((p) => doc.addPage(p));
        const bytes = await doc.save();
        lastResult = {
          blob: new Blob([bytes], { type: "application/pdf" }),
          name: baseName + "_" + label + "_" + PDFTools.timestamp() + ".pdf",
          pages: pageNumbers.length,
        };
        resultInfo.textContent = "已提取 " + lastResult.pages + " 页：" + pageNumbers.join(", ");
        resultBox.classList.remove("hidden");
        prog.done("提取完成，共 " + pageNumbers.length + " 页");
        PDFTools.toast("提取成功！共 " + pageNumbers.length + " 页", "success");
      } catch (err) {
        prog.fail();
        PDFTools.toast("提取失败：" + (err.message || err), "error", 5000);
        console.error(err);
      } finally {
        extractRangeBtn.disabled = extractPickBtn.disabled = false;
      }
    }

    extractRangeBtn.addEventListener("click", () => {
      if (!libDoc) { PDFTools.toast("请先选择 PDF 文件", "warning"); return; }
      let ranges;
      try {
        ranges = PDFTools.parseRanges(rangeInput.value, totalPages);
      } catch (err) {
        PDFTools.toast(err.message, "error", 4000);
        return;
      }
      const pages = PDFTools.rangesToPages(ranges);
      extractPages(pages, "pages");
    });

    extractPickBtn.addEventListener("click", () => {
      if (!libDoc) { PDFTools.toast("请先选择 PDF 文件", "warning"); return; }
      if (!selected.size) { PDFTools.toast("请先勾选要提取的页面", "warning"); return; }
      extractPages([...selected].sort((a, b) => a - b), "selected");
    });

    dlBtn.addEventListener("click", () => {
      if (lastResult) PDFTools.downloadBlob(lastResult.blob, lastResult.name);
    });
  </script>
</body>
</html>
