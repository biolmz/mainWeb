<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF 拆分 — PDF 工具箱</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="split">
  <header class="site-header">
    <nav class="nav">
      <a class="nav-logo" href="index.html">
        <span class="logo-mark">P</span>
        <span>PDF 工具箱</span>
      </a>
      <div class="nav-links">
        <a href="index.html" data-page="home">首页</a>
        <a href="merge.html" data-page="merge">合并</a>
        <a href="split.html" data-page="split">拆分</a>
        <a href="extract-pages.html" data-page="extract-pages">提取页面</a>
        <a href="extract-text.html" data-page="extract-text">提取文字</a>
        <a href="ocr.html" data-page="ocr">OCR 识别</a>
        <a href="extract-images.html" data-page="extract-images">提取图片</a>
        <a href="compress.html" data-page="compress">压缩</a>
        <a href="convert.html" data-page="convert">转 Word/Excel</a>
        <a href="about.html" data-page="about">关于</a>
      </div>
    </nav>
  </header>

  <main>
    <div class="container">
      <div class="page-head">
        <div class="breadcrumb"><a href="index.html">首页</a> / PDF 拆分</div>
        <h1>✂️ PDF 拆分</h1>
        <p>将一个 PDF 按「每 N 页一份」或「自定义页码范围」拆分成多个文件。</p>
      </div>

      <div class="card">
        <div class="card-body">
          <div id="dropzone" class="dropzone">
            <div class="dz-icon">📥</div>
            <div class="dz-main">点击选择 或 拖拽 PDF 文件到这里</div>
            <div class="dz-sub">每次处理 1 个 PDF 文件</div>
            <input id="fileInput" type="file" accept="application/pdf,.pdf" class="hidden" />
          </div>

          <div id="fileInfo" class="hidden" style="margin-top: 16px;">
            <span class="badge-pill" id="fileBadge">📄 文件名</span>
            <span class="muted small" id="fileMeta" style="margin-left: 10px;"></span>
          </div>

          <!-- 模式选择 -->
          <div id="configBox" class="hidden" style="margin-top: 20px;">
            <div class="tabs">
              <button class="tab-btn active" data-tab="every">按每 N 页</button>
              <button class="tab-btn" data-tab="custom">自定义范围</button>
            </div>

            <div id="panel-every" class="tab-panel active">
              <div class="field">
                <label for="pagesPerFile">每个文件包含的页数</label>
                <div class="form-row">
                  <input type="number" id="pagesPerFile" min="1" max="999" value="1" />
                  <button id="splitBtn" class="btn btn-primary">✂️ 开始拆分</button>
                </div>
                <div class="hint">例如：10 页的 PDF，每 3 页一份 → 拆成 4 个文件（3+3+3+1）</div>
              </div>
            </div>

            <div id="panel-custom" class="tab-panel">
              <div class="field">
                <label for="rangeInput">页码范围（从 1 开始）</label>
                <div class="form-row">
                  <input type="text" id="rangeInput" placeholder="例如：1-3,5,7-9 或 2,4,6" style="flex: 1; min-width: 220px;" />
                  <button id="splitBtnCustom" class="btn btn-primary">✂️ 开始拆分</button>
                </div>
                <div class="hint">每个范围生成一个文件，支持单个页码与区间，用逗号分隔</div>
              </div>
            </div>
          </div>

          <div id="progressBox"></div>

          <!-- 拆分结果 -->
          <div id="resultBox" class="hidden" style="margin-top: 20px;">
            <div class="result-toolbar">
              <div class="info" id="resultInfo"></div>
              <div style="display: flex; gap: 8px;">
                <button id="zipBtn" class="btn btn-success btn-sm">📦 打包全部下载 (ZIP)</button>
                <button id="dlAllBtn" class="btn btn-secondary btn-sm">⬇️ 逐个下载全部</button>
              </div>
            </div>
            <div id="resultList" class="file-list"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div>PDF 工具箱 · 纯前端本地处理</div>
      <span class="privacy-badge">🔒 本地处理，文件不上传</span>
    </div>
  </footer>

  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/pdf-utils.js"></script>
  <script>
    PDFTools.initNav("split");

    const fileInput = document.getElementById("fileInput");
    const dropzone = document.getElementById("dropzone");
    const fileInfo = document.getElementById("fileInfo");
    const fileBadge = document.getElementById("fileBadge");
    const fileMeta = document.getElementById("fileMeta");
    const configBox = document.getElementById("configBox");
    const progressBox = document.getElementById("progressBox");
    const resultBox = document.getElementById("resultBox");
    const resultInfo = document.getElementById("resultInfo");
    const resultList = document.getElementById("resultList");
    const zipBtn = document.getElementById("zipBtn");
    const dlAllBtn = document.getElementById("dlAllBtn");
    const splitBtn = document.getElementById("splitBtn");
    const splitBtnCustom = document.getElementById("splitBtnCustom");
    const pagesPerFile = document.getElementById("pagesPerFile");
    const rangeInput = document.getElementById("rangeInput");

    let srcDoc = null;   // pdf-lib 文档
    let totalPages = 0;
    let baseName = "output";
    let outputs = [];    // { name, blob, rangeText }

    /* ---- Tab 切换 ---- */
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
      });
    });

    /* ---- 文件选择 ---- */
    PDFTools.setupDropzone(dropzone, fileInput, async (list) => {
      const f = list[0];
      if (!f) return;
      if (!PDFTools.isPdf(f)) { PDFTools.toast("请选择 PDF 文件", "warning"); return; }
      try {
        srcDoc = await PdfUtils.loadPdfLibFile(f);
        totalPages = srcDoc.getPageCount();
        baseName = PDFTools.safeName(f.name.replace(/\.pdf$/i, ""));
        fileBadge.textContent = "📄 " + f.name;
        fileMeta.textContent = PDFTools.formatBytes(f.size) + " · 共 " + totalPages + " 页";
        fileInfo.classList.remove("hidden");
        configBox.classList.remove("hidden");
        resultBox.classList.add("hidden");
        outputs = [];
        PDFTools.toast("已加载：" + f.name + "（" + totalPages + " 页）", "success");
      } catch (err) {
        srcDoc = null;
        PDFTools.toast("无法读取 PDF：" + (err.message || err), "error", 5000);
        console.error(err);
      }
    });

    /* ---- 计算拆分计划 ---- */
    function computeParts(mode) {
      const parts = [];
      if (mode === "every") {
        const n = Math.max(1, parseInt(pagesPerFile.value, 10) || 1);
        for (let s = 1; s <= totalPages; s += n) {
          parts.push([s, Math.min(s + n - 1, totalPages)]);
        }
      } else {
        const ranges = PDFTools.parseRanges(rangeInput.value, totalPages);
        parts.push(...ranges);
      }
      return parts;
    }

    /* ---- 执行拆分 ---- */
    async function doSplit(mode) {
      if (!srcDoc) { PDFTools.toast("请先选择 PDF 文件", "warning"); return; }
      let parts;
      try {
        parts = computeParts(mode);
      } catch (err) {
        PDFTools.toast(err.message, "error", 4000);
        return;
      }
      if (!parts.length) { PDFTools.toast("没有可拆分的范围", "warning"); return; }

      splitBtn.disabled = splitBtnCustom.disabled = true;
      resultBox.classList.add("hidden");
      outputs = [];
      const prog = PDFTools.showProgress(progressBox, "开始拆分…");

      try {
        let done = 0;
        for (const [s, e] of parts) {
          const doc = await PDFLib.PDFDocument.create();
          const idxs = [];
          for (let i = s; i <= e; i++) idxs.push(i - 1);
          const pages = await doc.copyPages(srcDoc, idxs);
          pages.forEach((p) => doc.addPage(p));
          const bytes = await doc.save();
          outputs.push({
            name: baseName + "_p" + s + "-" + e + ".pdf",
            rangeText: "第 " + s + "-" + e + " 页（" + (e - s + 1) + " 页）",
            blob: new Blob([bytes], { type: "application/pdf" }),
          });
          done++;
          prog.set(done / parts.length * 95, "已生成 " + done + "/" + parts.length + " 个文件");
        }
        renderResults();
        prog.done("拆分完成，共 " + outputs.length + " 个文件");
        PDFTools.toast("拆分成功！共 " + outputs.length + " 个文件", "success");
      } catch (err) {
        prog.fail();
        PDFTools.toast("拆分失败：" + (err.message || err), "error", 5000);
        console.error(err);
      } finally {
        splitBtn.disabled = splitBtnCustom.disabled = false;
      }
    }

    function renderResults() {
      const totalSize = outputs.reduce((s, o) => s + o.blob.size, 0);
      resultInfo.textContent = "共 " + outputs.length + " 个文件 · " + PDFTools.formatBytes(totalSize);

      resultList.innerHTML = "";
      outputs.forEach((o, idx) => {
        const el = document.createElement("div");
        el.className = "file-item";
        el.innerHTML = `
          <span class="f-icon">📄</span>
          <span class="f-info">
            <div class="f-name">${escapeHtml(o.name)}</div>
            <div class="f-meta">${o.rangeText} · ${PDFTools.formatBytes(o.blob.size)}</div>
          </span>
          <span class="f-actions">
            <button class="btn btn-secondary btn-sm" data-dl="${idx}">下载</button>
          </span>
        `;
        el.querySelector('[data-dl]').addEventListener("click", () => PDFTools.downloadBlob(o.blob, o.name));
        resultList.appendChild(el);
      });
      resultBox.classList.remove("hidden");
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    splitBtn.addEventListener("click", () => doSplit("every"));
    splitBtnCustom.addEventListener("click", () => doSplit("custom"));

    zipBtn.addEventListener("click", async () => {
      if (!outputs.length) return;
      zipBtn.disabled = true;
      try {
        await PDFTools.zipDownload(outputs, baseName + "_split_" + PDFTools.timestamp() + ".zip");
        PDFTools.toast("ZIP 已开始下载", "success");
      } catch (err) {
        PDFTools.toast("打包失败：" + err.message, "error");
      } finally {
        zipBtn.disabled = false;
      }
    });

    dlAllBtn.addEventListener("click", () => {
      if (!outputs.length) return;
      outputs.forEach((o) => PDFTools.downloadBlob(o.blob, o.name));
      PDFTools.toast("已开始逐个下载 " + outputs.length + " 个文件", "success");
    });
  </script>
</body>
</html>
