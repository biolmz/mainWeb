    <!-- ============================================================

    <script>
        (function() {
            'use strict';

            // ==========================================================
            // 1. 配置
            // ==========================================================
            const CONFIG = {
                PAGE_SIZE: 50,
                MAX_RETRIES: 3,
                CACHE_KEY: 'download_files_cache',
                CACHE_TTL: 3600000, // 1小时
                COMMENTS_REPO: 'lmz00701/MY_WEB_SELF' // ← 改成你的 GitHub 用户名/仓库名
            };

            // ==========================================================
            // 2. DOM 引用
            // ==========================================================
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const fileListEl = $('#fileList');
            const skeletonEl = $('#skeletonLoader');
            const searchInput = $('#searchInput');
            const filterBtns = $$('#filterGroup button');
            const statsInfo = $('#statsInfo');
            const fileCountEl = $('#fileCount');
            const lastUpdateEl = $('#lastUpdate');
            const sortSelect = $('#sortSelect');
            const paginationEl = $('#pagination');
            const selectAllBtn = $('#selectAllBtn');
            const selectAllText = $('#selectAllText');
            const selectedCountEl = $('#selectedCount');
            const downloadSelectedBtn = $('#downloadSelectedBtn');
            const refreshBtn = $('#refreshBtn');
            const themeToggle = $('#themeToggle');
            const listViewBtn = $('#listViewBtn');
            const gridViewBtn = $('#gridViewBtn');
            const previewModal = $('#previewModal');
            const previewTitle = $('#previewTitle');
            const previewBody = $('#previewBody');
            const closePreviewBtn = $('#closePreview');
            const statusDot = $('#statusDot');
            const statusText = $('#statusText');
            const visitCountEl = $('#visitCount');

            // ==========================================================
            // 3. 状态
            // ==========================================================
            let files = [];
            let filteredFiles = [];
            let currentCat = 'all';
            let currentKeyword = '';
            let currentSort = 'date-desc';
            let currentPage = 1;
            let viewMode = 'list';
            let selectedFiles = new Set();
            let isLoading = false;
            let retryCount = 0;
            let totalPages = 0;

            // ==========================================================
            // 4. 图标映射
            // ==========================================================
            const iconMap = {
                pdf: '📄',
                docx: '📝',
                xlsx: '📊',
                pptx: '📑',
                zip: '📦',
                rar: '📦',
                '7z': '📦',
                video: '🎬',
                audio: '🎵',
                image: '🖼️',
                file: '📎'
            };

            const catMap = {
                doc: '文档',
                video: '视频',
                audio: '音频',
                archive: '压缩包',
                image: '图片'
            };

            const previewableExts = ['pdf', 'png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'txt', 'md'];

            function getIcon(iconKey) { return iconMap[iconKey] || iconMap.file; }

            function getCatLabel(cat) { return catMap[cat] || cat; }

            function isPreviewable(ext) { return previewableExts.includes(ext.toLowerCase()); }

            // ==========================================================
            // 5. 缓存
            // ==========================================================
            function getCache() {
                try {
                    const cached = localStorage.getItem(CONFIG.CACHE_KEY);
                    if (cached) {
                        const { data, timestamp } = JSON.parse(cached);
                        if (Date.now() - timestamp < CONFIG.CACHE_TTL) {
                            return data;
                        }
                    }
                } catch (e) { return null; }
                return null;
            }

            function setCache(data) {
                try {
                    localStorage.setItem(CONFIG.CACHE_KEY, JSON.stringify({
                        data: data,
                        timestamp: Date.now()
                    }));
                } catch (e) { /* ignore */ }
            }

            // ==========================================================
            // 6. 访问统计 (不蒜子)
            // ==========================================================
            function loadVisitCount() {
                const script = document.createElement('script');
                script.src = 'https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js';
                script.async = true;
                script.onload = function() {
                    setTimeout(() => {
                        const countEl = document.querySelector('.busuanzi-value');
                        if (countEl) {
                            visitCountEl.textContent = '👁️ 访问：' + countEl.textContent;
                        }
                    }, 1000);
                };
                document.head.appendChild(script);
                visitCountEl.textContent = '👁️ 加载中...';
            }

            // ==========================================================
            // 7. 留言板 (GitHub Issues)
            // ==========================================================
            async function loadComments() {
                const container = $('#commentsList');
                try {
                    const [owner, repo] = CONFIG.COMMENTS_REPO.split('/');
                    const res = await fetch(
                        `https://api.github.com/repos/${owner}/${repo}/issues?state=open&per_page=5&sort=updated`
                    );
                    if (!res.ok) throw new Error('Failed to load comments');
                    const issues = await res.json();

                    if (issues.length === 0) {
                        container.innerHTML = `
                            <div class="comment-item">
                                <span class="author">💡</span>
                                <span class="time">暂无留言</span>
                                <div class="body">成为第一个留言的人吧！</div>
                            </div>
                        `;
                        return;
                    }

                    container.innerHTML = issues.map(issue => `
                        <div class="comment-item">
                            <span class="author">${escapeHtml(issue.user?.login || '匿名')}</span>
                            <span class="time">${new Date(issue.created_at).toLocaleDateString('zh-CN')}</span>
                            <div class="body">
                                <a href="${issue.html_url}" target="_blank" rel="noopener noreferrer">
                                    ${escapeHtml(issue.title)}
                                </a>
                            </div>
                        </div>
                    `).join('');

                } catch (err) {
                    console.warn('加载留言失败:', err);
                    container.innerHTML = `
                        <div class="comment-item">
                            <span class="author">💬</span>
                            <span class="time">--</span>
                            <div class="body">留言加载失败，<a href="https://github.com/${CONFIG.COMMENTS_REPO}/issues" target="_blank" rel="noopener noreferrer">点击在 GitHub 上查看</a></div>
                        </div>
                    `;
                }
            }

            // ==========================================================
            // 8. 加载文件 (含重试)
            // ==========================================================
            async function loadFiles(forceRefresh = false) {
                if (isLoading) return;
                isLoading = true;
                showSkeleton();
                updateStatus('loading');

                try {
                    if (!forceRefresh) {
                        const cached = getCache();
                        if (cached && cached.length > 0) {
                            files = cached;
                            applyFiltersAndSort();
                            hideSkeleton();
                            updateStatus('online');
                            isLoading = false;
                            return;
                        }
                    }

                    const res = await fetch('files.json?t=' + Date.now(), {
                        cache: 'no-store',
                        headers: { 'Accept': 'application/json' }
                    });

                    if (!res.ok) throw new Error('HTTP ' + res.status);

                    const data = await res.json();
                    if (!Array.isArray(data)) throw new Error('数据格式错误');

                    files = data;
                    if (files.length > 0) setCache(files);

                    updateLastModified();

                    applyFiltersAndSort();
                    hideSkeleton();
                    updateStatus('online');
                    retryCount = 0;

                } catch (err) {
                    console.error('加载失败:', err);
                    retryCount++;

                    const cached = getCache();
                    if (cached && cached.length > 0) {
                        files = cached;
                        applyFiltersAndSort();
                        hideSkeleton();
                        updateStatus('offline');
                        showError('⚠️ 使用缓存数据 (网络异常)', true);
                        isLoading = false;
                        return;
                    }

                    if (retryCount < CONFIG.MAX_RETRIES) {
                        const delay = 2000 * retryCount;
                        showError(`⏳ 重试中 (${retryCount}/${CONFIG.MAX_RETRIES})`, false);
                        setTimeout(() => {
                            loadFiles(true);
                        }, delay);
                    } else {
                        showError('❌ 加载失败，请检查网络连接', true);
                        updateStatus('offline');
                    }
                } finally {
                    if (!document.querySelector('.error-state')) {
                        isLoading = false;
                    }
                }
            }

            // ==========================================================
            // 9. 更新状态显示
            // ==========================================================
            function updateStatus(status) {
                if (status === 'online') {
                    statusDot.className = 'status-dot online';
                    statusText.textContent = '在线';
                } else if (status === 'offline') {
                    statusDot.className = 'status-dot offline';
                    statusText.textContent = '离线';
                } else {
                    statusDot.className = 'status-dot online';
                    statusText.textContent = '加载中...';
                }
            }

            function updateLastModified() {
                if (files.length > 0) {
                    const dates = files.map(f => f.date).filter(d => d);
                    if (dates.length > 0) {
                        const latest = dates.sort().reverse()[0];
                        lastUpdateEl.textContent = '更新时间：' + latest;
                    }
                }
            }

            // ==========================================================
            // 10. 骨架屏
            // ==========================================================
            function showSkeleton() {
                if (skeletonEl) {
                    skeletonEl.style.display = viewMode === 'grid' ? 'grid' : 'flex';
                    skeletonEl.className = 'skeleton-list' + (viewMode === 'grid' ? ' grid-view' : '');
                }
                fileListEl.querySelectorAll('.file-card, .empty-state, .error-state').forEach(el => el.remove());
            }

            function hideSkeleton() {
                if (skeletonEl) skeletonEl.style.display = 'none';
            }

            // ==========================================================
            // 11. 错误显示
            // ==========================================================
            function showError(message, showRetry) {
                hideSkeleton();
                fileListEl.querySelectorAll('.file-card, .empty-state, .error-state').forEach(el => el.remove());

                const div = document.createElement('div');
                div.className = 'error-state';
                div.innerHTML = `
                    <span class="icon">${message.includes('⚠️') ? '⚠️' : '❌'}</span>
                    <h3>${message}</h3>
                    ${showRetry ? `<button class="retry-btn" onclick="window.loadFiles(true)">🔄 重新加载</button>` : ''}
                `;
                fileListEl.appendChild(div);
                fileCountEl.textContent = '加载失败';
                statsInfo.textContent = '加载失败';
            }

            // ==========================================================
            // 12. 筛选、排序、分页
            // ==========================================================
            function applyFiltersAndSort() {
                filteredFiles = files.filter(f => {
                    const matchCat = currentCat === 'all' || f.cat === currentCat;
                    const kw = currentKeyword.toLowerCase().trim();
                    const matchKw = !kw ||
                        f.name.toLowerCase().includes(kw) ||
                        f.ext.toLowerCase().includes(kw) ||
                        (f.cat && f.cat.toLowerCase().includes(kw));
                    return matchCat && matchKw;
                });

                sortFiles(filteredFiles, currentSort);

                const total = files.length;
                const filtered = filteredFiles.length;
                fileCountEl.textContent = filtered + ' 个文件';
                statsInfo.textContent = filtered === total ?
                    '共 ' + total + ' 个文件' :
                    '显示 ' + filtered + ' / ' + total + ' 个文件';

                selectedFiles.clear();
                updateSelectionUI();

                totalPages = Math.ceil(filtered / CONFIG.PAGE_SIZE);
                if (currentPage > totalPages) currentPage = 1;
                if (currentPage < 1) currentPage = 1;

                const start = (currentPage - 1) * CONFIG.PAGE_SIZE;
                const end = start + CONFIG.PAGE_SIZE;
                const pageData = filteredFiles.slice(start, end);

                renderFiles(pageData);
                renderPagination();
            }

            // ==========================================================
            // 13. 排序
            // ==========================================================
            function sortFiles(arr, sortKey) {
                const parseSize = (sizeStr) => {
                    const match = sizeStr.match(/^([\d.]+)\s*(B|KB|MB|GB)$/);
                    if (!match) return 0;
                    const num = parseFloat(match[1]);
                    const unit = match[2];
                    const multipliers = { B: 1, KB: 1024, MB: 1024 ** 2, GB: 1024 ** 3 };
                    return num * (multipliers[unit] || 1);
                };

                arr.sort((a, b) => {
                    switch (sortKey) {
                        case 'date-desc':
                            return (b.date || '').localeCompare(a.date || '');
                        case 'date-asc':
                            return (a.date || '').localeCompare(b.date || '');
                        case 'name-asc':
                            return a.name.localeCompare(b.name, 'zh');
                        case 'name-desc':
                            return b.name.localeCompare(a.name, 'zh');
                        case 'size-desc':
                            return parseSize(b.size) - parseSize(a.size);
                        case 'size-asc':
                            return parseSize(a.size) - parseSize(b.size);
                        default:
                            return 0;
                    }
                });
            }

            // ==========================================================
            // 14. 渲染文件
            // ==========================================================
            function renderFiles(arr) {
                fileListEl.querySelectorAll('.file-card, .empty-state, .error-state').forEach(el => el.remove());

                if (arr.length === 0) {
                    const div = document.createElement('div');
                    div.className = 'empty-state';
                    div.innerHTML = `
                        <span class="icon">🔍</span>
                        <h3>没有找到匹配的文件</h3>
                        <p>试试调整搜索关键词或筛选条件</p>
                    `;
                    fileListEl.appendChild(div);
                    return;
                }

                fileListEl.className = 'file-list' + (viewMode === 'grid' ? ' grid-view' : '');

                const fragment = document.createDocumentFragment();

                arr.forEach((f, i) => {
                    const card = document.createElement('div');
                    card.className = 'file-card' + (viewMode === 'grid' ? ' grid' : '');
                    card.style.animationDelay = (i % 30) * 10 + 'ms';
                    card.setAttribute('role', 'listitem');
                    card.dataset.fileId = f.name;

                    const isChecked = selectedFiles.has(f.name);
                    const catLabel = getCatLabel(f.cat);
                    const isPreviewable = isPreviewable(f.ext);

                    card.innerHTML = `
                        <div class="checkbox ${isChecked ? 'checked' : ''}" data-file="${escapeHtml(f.name)}" role="checkbox" aria-checked="${isChecked}"></div>
                        <div class="file-icon ${f.icon}" aria-hidden="true">${getIcon(f.icon)}</div>
                        <div class="file-info">
                            <div class="name" title="${escapeHtml(f.name)}" data-preview="${escapeHtml(f.url)}" data-ext="${f.ext}">
                                ${escapeHtml(f.name)}
                            </div>
                            <div class="meta">
                                <span>${f.ext}</span>
                                <span class="dot"></span>
                                <span>${f.size}</span>
                                <span class="dot"></span>
                                <span>${f.date || '--'}</span>
                                <span class="dot"></span>
                                <span class="tag-cat">${catLabel}</span>
                                ${isPreviewable ? '<span class="tag-cat" style="background:var(--success-light);color:var(--success);">预览</span>' : ''}
                            </div>
                        </div>
                        <a class="download-btn" href="${f.url}" target="_blank" rel="noopener noreferrer" title="下载 ${escapeHtml(f.name)}" aria-label="下载 ${escapeHtml(f.name)}">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                        </a>
                    `;

                    const checkbox = card.querySelector('.checkbox');
                    checkbox.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleSelect(f.name);
                    });

                    const nameEl = card.querySelector('.name');
                    nameEl.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (isPreviewable) {
                            openPreview(f);
                        }
                    });

                    fragment.appendChild(card);
                });

                fileListEl.appendChild(fragment);
            }

            // ==========================================================
            // 15. 分页
            // ==========================================================
            function renderPagination() {
                if (totalPages <= 1) {
                    paginationEl.innerHTML = '';
                    return;
                }

                let html = `
                    <button ${currentPage <= 1 ? 'disabled' : ''} data-page="${currentPage - 1}">‹</button>
                `;

                let startPage = Math.max(1, currentPage - 2);
                let endPage = Math.min(totalPages, currentPage + 2);

                if (startPage > 1) {
                    html += `<button data-page="1">1</button>`;
                    if (startPage > 2) html += `<span class="info">…</span>`;
                }

                for (let i = startPage; i <= endPage; i++) {
                    html += `<button data-page="${i}" class="${i === currentPage ? 'active' : ''}">${i}</button>`;
                }

                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) html += `<span class="info">…</span>`;
                    html += `<button data-page="${totalPages}">${totalPages}</button>`;
                }

                html += `
                    <button ${currentPage >= totalPages ? 'disabled' : ''} data-page="${currentPage + 1}">›</button>
                    <span class="info">${currentPage} / ${totalPages}</span>
                `;

                paginationEl.innerHTML = html;

                paginationEl.querySelectorAll('button:not([disabled])').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const page = parseInt(btn.dataset.page);
                        if (page && page !== currentPage) {
                            currentPage = page;
                            applyFiltersAndSort();
                            fileListEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    });
                });
            }

            // ==========================================================
            // 16. 选择逻辑
            // ==========================================================
            function toggleSelect(fileName) {
                if (selectedFiles.has(fileName)) {
                    selectedFiles.delete(fileName);
                } else {
                    selectedFiles.add(fileName);
                }
                updateSelectionUI();
                applyFiltersAndSort();
            }

            function toggleSelectAll() {
                const currentPageFiles = getCurrentPageFiles();
                const allSelected = currentPageFiles.every(f => selectedFiles.has(f.name));

                if (allSelected) {
                    currentPageFiles.forEach(f => selectedFiles.delete(f.name));
                } else {
                    currentPageFiles.forEach(f => selectedFiles.add(f.name));
                }
                updateSelectionUI();
                applyFiltersAndSort();
            }

            function getCurrentPageFiles() {
                const start = (currentPage - 1) * CONFIG.PAGE_SIZE;
                const end = start + CONFIG.PAGE_SIZE;
                return filteredFiles.slice(start, end);
            }

            function updateSelectionUI() {
                const count = selectedFiles.size;
                selectedCountEl.textContent = count;
                downloadSelectedBtn.disabled = count === 0;

                const currentPageFiles = getCurrentPageFiles();
                const allSelected = currentPageFiles.length > 0 && currentPageFiles.every(f => selectedFiles.has(f.name));
                selectAllText.textContent = allSelected ? '取消全选' : '全选';
            }

            // ==========================================================
            // 17. 批量下载
            // ==========================================================
            async function downloadSelected() {
                const selected = files.filter(f => selectedFiles.has(f.name));
                if (selected.length === 0) return;

                downloadSelectedBtn.disabled = true;
                downloadSelectedBtn.textContent = '⏳ 打包中...';

                try {
                    const zip = new JSZip();
                    let loaded = 0;

                    for (const file of selected) {
                        try {
                            const response = await fetch(file.url);
                            if (!response.ok) throw new Error('下载失败');
                            const blob = await response.blob();
                            zip.file(file.name, blob);
                            loaded++;
                        } catch (err) {
                            console.warn('下载失败:', file.name, err);
                        }
                    }

                    if (loaded === 0) {
                        alert('所有文件下载失败，请检查网络连接');
                        return;
                    }

                    const zipBlob = await zip.generateAsync({ type: 'blob' });
                    saveAs(zipBlob, `资料下载_${new Date().toISOString().slice(0,10)}.zip`);
                    alert(`✅ 成功下载 ${loaded} 个文件`);

                } catch (err) {
                    console.error('批量下载失败:', err);
                    alert('❌ 批量下载失败，请重试');
                } finally {
                    downloadSelectedBtn.disabled = selectedFiles.size === 0;
                    downloadSelectedBtn.innerHTML = '📦 批量下载';
                }
            }

            // ==========================================================
            // 18. 预览
            // ==========================================================
            function openPreview(file) {
                previewTitle.textContent = file.name;
                const ext = file.ext.toLowerCase();

                let content = '';

                if (ext === 'pdf') {
                    content = `<iframe class="preview-pdf" src="${file.url}#toolbar=1" title="${escapeHtml(file.name)}"></iframe>`;
                } else if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) {
                    content = `<img class="preview-image" src="${file.url}" alt="${escapeHtml(file.name)}" loading="lazy" />`;
                } else if (['txt', 'md'].includes(ext)) {
                    fetch(file.url)
                        .then(res => res.text())
                        .then(text => {
                            previewBody.innerHTML = `<pre class="preview-text">${escapeHtml(text)}</pre>`;
                        })
                        .catch(() => {
                            previewBody.innerHTML = `
                                <div class="preview-unsupported">
                                    <span class="icon">📄</span>
                                    <p>无法加载文本内容，请下载后查看</p>
                                    <a href="${file.url}" target="_blank" rel="noopener noreferrer" style="color:var(--accent);">下载文件</a>
                                </div>
                            `;
                        });
                    previewModal.classList.add('active');
                    return;
                } else {
                    content = `
                        <div class="preview-unsupported">
                            <span class="icon">📄</span>
                            <p>该文件类型暂不支持预览</p>
                            <a href="${file.url}" target="_blank" rel="noopener noreferrer" style="color:var(--accent);">下载文件</a>
                        </div>
                    `;
                }

                if (content) {
                    previewBody.innerHTML = content;
                }

                previewModal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closePreview() {
                previewModal.classList.remove('active');
                document.body.style.overflow = '';
                setTimeout(() => {
                    previewBody.innerHTML = `
                        <div class="preview-unsupported">
                            <span class="icon">📄</span>
                            <p>加载预览中...</p>
                        </div>
                    `;
                }, 300);
            }

            // ==========================================================
            // 19. 工具函数
            // ==========================================================
            function escapeHtml(text) {
                const d = document.createElement('div');
                d.textContent = text;
                return d.innerHTML;
            }

            // ==========================================================
            // 20. 事件绑定
            // ==========================================================
            let debounceTimer;
            searchInput.addEventListener('input', function() {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    currentKeyword = this.value;
                    currentPage = 1;
                    applyFiltersAndSort();
                }, 300);
            });

            filterBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterBtns.forEach(b => {
                        b.classList.remove('active');
                        b.setAttribute('aria-selected', 'false');
                    });
                    this.classList.add('active');
                    this.setAttribute('aria-selected', 'true');
                    currentCat = this.dataset.cat;
                    currentPage = 1;
                    applyFiltersAndSort();
                });
            });

            sortSelect.addEventListener('change', function() {
                currentSort = this.value;
                currentPage = 1;
                applyFiltersAndSort();
            });

            selectAllBtn.addEventListener('click', toggleSelectAll);

            downloadSelectedBtn.addEventListener('click', downloadSelected);

            refreshBtn.addEventListener('click', function() {
                this.textContent = '⏳';
                loadFiles(true).finally(() => {
                    this.textContent = '🔄';
                });
            });

            listViewBtn.addEventListener('click', function() {
                viewMode = 'list';
                listViewBtn.classList.add('active');
                gridViewBtn.classList.remove('active');
                applyFiltersAndSort();
            });

            gridViewBtn.addEventListener('click', function() {
                viewMode = 'grid';
                gridViewBtn.classList.add('active');
                listViewBtn.classList.remove('active');
                applyFiltersAndSort();
            });

            const root = document.documentElement;
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const savedTheme = localStorage.getItem('theme') || (prefersDark ? 'dark' : 'light');
            root.setAttribute('data-theme', savedTheme);

            themeToggle.addEventListener('click', function() {
                const current = root.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
            });

            closePreviewBtn.addEventListener('click', closePreview);
            previewModal.addEventListener('click', function(e) {
                if (e.target === this) closePreview();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closePreview();
            });

            // ==========================================================
            // 21. 暴露全局
            // ==========================================================
            window.loadFiles = loadFiles;
            window.toggleSelect = toggleSelect;

            // ==========================================================
            // 22. 启动
            // ==========================================================
            loadVisitCount();
            loadComments();
            loadFiles();

            setInterval(() => {
                loadFiles(true);
            }, 1800000);

            console.log('📂 资料下载中心已加载');
            console.log(`📊 当前主题: ${savedTheme}`);
            console.log(`📄 每页显示: ${CONFIG.PAGE_SIZE} 个文件`);

        })();
    </script>

</body>
</html>
