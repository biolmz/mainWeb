<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f7f8fa;
    --text: #1a1a1a;
    --text-secondary: #666;
    --border: #e8e8e8;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.08), 0 4px 6px -4px rgba(0,0,0,.04);
    --radius: 12px;
    --transition: .25s ease;
  }

  [data-theme="dark"] {
    --bg: #0f1115;
    --bg-card: #1a1d24;
    --text: #e8e8e8;
    --text-secondary: #9ca3af;
    --border: #2a2f3a;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --shadow: 0 1px 3px rgba(0,0,0,.3);
    --shadow-lg: 0 10px 15px -3px rgba(0,0,0,.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background var(--transition), color var(--transition);
    -webkit-font-smoothing: antialiased;
  }

  .header {
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(12px);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    transition: background var(--transition), border-color var(--transition);
  }

  .header-inner {
    max-width: 880px; margin: 0 auto;
    padding: 18px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }

  .logo {
    font-size: 20px; font-weight: 700;
    color: var(--text); text-decoration: none;
    display: flex; align-items: center; gap: 10px;
  }

  .logo-icon {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    display: flex; align-items: center; justify-content: center; color: #fff;
  }

  .theme-toggle {
    width: 42px; height: 42px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg-card);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--text); transition: all var(--transition);
  }
  .theme-toggle:hover { border-color: var(--accent); }

  .main { max-width: 880px; margin: 0 auto; padding: 56px 24px 80px; }

  .hero { text-align: center; margin-bottom: 56px; }
  .hero h1 { font-size: 36px; font-weight: 800; letter-spacing: -1px; margin-bottom: 12px; }
  .hero p { font-size: 17px; color: var(--text-secondary); max-width: 520px; margin: 0 auto; line-height: 1.6; }

  .search-bar { max-width: 520px; margin: 0 auto 40px; position: relative; }
  .search-bar input {
    width: 100%; padding: 14px 20px 14px 48px; font-size: 15px;
    border: 1.5px solid var(--border); border-radius: var(--radius);
    background: var(--bg-card); color: var(--text); outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .search-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .search-bar .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 40px; }
  .filter-btn {
    padding: 8px 18px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text-secondary); font-size: 14px;
    cursor: pointer; transition: all var(--transition); font-weight: 500;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .file-list { display: flex; flex-direction: column; gap: 14px; }

  .file-card {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 20px; background: var(--bg-card);
    border: 1px solid var(--border); border-radius: var(--radius);
    transition: all var(--transition); animation: fadeIn .35s ease both;
  }
  .file-card:hover { border-color: var(--accent); box-shadow: var(--shadow-lg); transform: translateY(-1px); }

  .file-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .file-icon svg { width: 22px; height: 22px; }
  .file-icon.pdf  { background: #fee2e2; color: #dc2626; }
  .file-icon.docx { background: #dbeafe; color: #2563eb; }
  .file-icon.xlsx { background: #d1fae5; color: #059669; }
  .file-icon.pptx { background: #fef3c7; color: #d97706; }
  .file-icon.zip  { background: #f3e8ff; color: #7c3aed; }
  .file-icon.video{ background: #ffedd5; color: #ea580c; }
  .file-icon.audio{ background: #e0e7ff; color: #4f46e5; }
  .file-icon.image{ background: #fce7f3; color: #db2777; }
  .file-icon.file { background: #f1f5f9; color: #475569; }

  [data-theme="dark"] .file-icon.pdf  { background: rgba(220,38,38,.15); }
  [data-theme="dark"] .file-icon.docx { background: rgba(37,99,235,.15); }
  [data-theme="dark"] .file-icon.xlsx { background: rgba(5,150,105,.15); }
  [data-theme="dark"] .file-icon.pptx { background: rgba(217,119,6,.15); }
  [data-theme="dark"] .file-icon.zip  { background: rgba(124,58,237,.15); }
  [data-theme="dark"] .file-icon.video{ background: rgba(234,88,12,.15); }
  [data-theme="dark"] .file-icon.audio{ background: rgba(79,70,229,.15); }
  [data-theme="dark"] .file-icon.image{ background: rgba(219,39,119,.15); }
  [data-theme="dark"] .file-icon.file { background: rgba(148,163,184,.12); }

  .file-info { flex: 1; min-width: 0; }
  .file-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-meta { font-size: 13px; color: var(--text-secondary); display: flex; gap: 12px; align-items: center; }
  .file-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-secondary); opacity: .5; }

  .download-btn {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border);
    background: transparent; color: var(--text-secondary); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    transition: all var(--transition); flex-shrink: 0; text-decoration: none;
  }
  .download-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .download-btn svg { width: 18px; height: 18px; }

  .footer { text-align: center; padding: 32px 24px; color: var(--text-secondary); font-size: 13px; border-top: 1px solid var(--border); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
  .empty-state .icon { margin-bottom: 16px; display: flex; justify-content: center; }
  .empty-state p { font-size: 15px; }

  .loading-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
  .loading-state .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }

  @media (max-width: 640px) {
    .hero h1 { font-size: 28px; }
    .hero p { font-size: 15px; }
    .main { padding: 36px 16px 60px; }
    .file-card { padding: 14px 16px; gap: 12px; }
    .file-icon { width: 38px; height: 38px; }
    .file-icon svg { width: 19px; height: 19px; }
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">

      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

</header>

<main class="main">
  <section class="hero">
    <h1>资料下载中心</h1>

</main>

</footer>

<script>
const iconSvg = {
  pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
  docx: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
  xlsx: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
  pptx: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
  zip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>',
  video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>',
  audio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>'
};
const downloadSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

const fileListEl = document.getElementById("fileList");
const searchInput = document.getElementById("searchInput");
const filterBtns = document.querySelectorAll(".filter-btn");

let files = [];
let currentCat = "all";
let currentKeyword = "";

async function loadFiles() {
  try {
    const res = await fetch('files.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    files = await res.json();
    render();
  } catch (e) {
    fileListEl.innerHTML = `
      <div class="empty-state">
        <div class="icon">${iconSvg.file}</div>
        <p>文件列表加载失败，请稍后刷新重试</p>
      </div>`;
    console.error(e);
  }
}

function render() {
  const filtered = files.filter(f => {
    const matchCat = currentCat === "all" || f.cat === currentCat;
    const matchKw = !currentKeyword ||
      f.name.toLowerCase().includes(currentKeyword.toLowerCase()) ||
      f.ext.toLowerCase().includes(currentKeyword.toLowerCase());
    return matchCat && matchKw;
  });

  if (filtered.length === 0) {
    fileListEl.innerHTML = `
      <div class="empty-state">
        <div class="icon">${iconSvg.file}</div>
        <p>没有找到匹配的文件，换个关键词试试？</p>
      </div>`;
    return;
  }

  fileListEl.innerHTML = filtered.map(f => `
    <div class="file-card">
      <a href="${f.url}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:16px;flex:1;min-width:0;text-decoration:none;color:inherit;">
        <div class="file-icon ${f.icon}">${iconSvg[f.icon] || iconSvg.file}</div>
        <div class="file-info">
          <div class="file-name">${escapeHtml(f.name)}</div>
          <div class="file-meta">
            <span>${f.ext}</span>
            <span class="dot"></span>
            <span>${f.size}</span>
            <span class="dot"></span>
            <span>${f.date}</span>
          </div>
        </div>
      </a>
      <a class="download-btn" href="${f.url}" target="_blank" rel="noopener" title="下载" onclick="event.stopPropagation()">
        ${downloadSvg}
      </a>
    </div>
  `).join("");
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

let debounceTimer;
searchInput.addEventListener("input", e => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    currentKeyword = e.target.value.trim();
    render();
  }, 200);
});

filterBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    filterBtns.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentCat = btn.dataset.cat;
    render();
  });
});

const themeToggle = document.getElementById("themeToggle");
const root = document.documentElement;
const savedTheme = localStorage.getItem("theme") || "light";
root.setAttribute("data-theme", savedTheme);

themeToggle.addEventListener("click", () => {
  const isDark = root.getAttribute("data-theme") === "dark";
  const newTheme = isDark ? "light" : "dark";
  root.setAttribute("data-theme", newTheme);
  localStorage.setItem("theme", newTheme);
});

loadFiles();
</script>
</body>
