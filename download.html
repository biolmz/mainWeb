<style>
:root{

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;transition:background var(--transition),color var(--transition);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow-x:hidden}

/* Header */
.header{position:sticky;top:0;z-index:100;backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);background:rgba(var(--bg-rgb,255,255,255),.72);border-bottom:1px solid var(--border);transition:background var(--transition),border-color var(--transition);height:var(--header-height);display:flex;align-items:center}
[data-theme="light"]{--bg-rgb:255,255,255}

.header-inner{max-width:var(--max-width);width:100%;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:18px;font-weight:700;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:10px;flex-shrink:0}

/* Clock */
.live-clock{font-size:12px;font-weight:500;color:var(--text-secondary);background:var(--bg-card);padding:4px 12px;border-radius:999px;border:1px solid var(--border);display:flex;align-items:center;gap:5px;white-space:nowrap;transition:all var(--transition)}

.network-status.online .status-dot{background:var(--success)}
.network-status.offline .status-dot{background:var(--danger);animation:pulse-dot 1.2s ease-in-out infinite}

.file-list{display:flex;flex-direction:column;gap:10px}
.file-card{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);transition:all var(--transition);animation:fadeIn .3s ease both;will-change:transform,border-color}
.file-card:hover{border-color:var(--accent);box-shadow:var(--shadow-lg);transform:translateY(-1px)}

.file-icon.audio{background:#e0e7ff;color:#4f46e5}
.file-icon.image{background:#fce7f3;color:#db2777}
.file-icon.file{background:#f1f5f9;color:#475569}

[data-theme="dark"] .file-icon.pptx{background:rgba(217,119,6,.15)}
[data-theme="dark"] .file-icon.zip{background:rgba(124,58,237,.15)}

.footer{text-align:center;padding:20px;color:var(--text-secondary);font-size:12px;border-top:1px solid var(--border);max-width:var(--max-width);margin:0 auto}

.empty-state{text-align:center;padding:40px 16px;color:var(--text-secondary)}
.empty-state .icon{margin-bottom:10px;display:flex;justify-content:center;opacity:.45}
.empty-state .icon svg{width:44px;height:44px;stroke:currentColor}

.loading-state{text-align:center;padding:40px 16px;color:var(--text-secondary)}
.loading-state .spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}

/* Progress bar */
.progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),#8b5cf6);z-index:9999;transition:width .3s ease,opacity .3s ease;width:0%;opacity:0;border-radius:0 2px 2px 0}

/* Toast */
.toast-container{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:90%}
.toast{padding:10px 20px;border-radius:12px;background:var(--toast-bg);color:var(--toast-text);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards;pointer-events:auto;text-align:center;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);max-width:400px;word-break:break-word}
.toast.error{border-color:var(--danger)}

.toast.warning{border-color:var(--warning)}
.toast.info{border-color:var(--accent)}

@keyframes toastOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-20px) scale(.95)}}

.security-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:9999;align-items:center;justify-content:center;backdrop-filter:blur(6px)}

.watermark-layer{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9998;overflow:hidden;opacity:.04;font-size:14px;color:#000;line-height:60px;user-select:none;-webkit-user-select:none}

.back-to-top.visible{display:flex}
.back-to-top:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.back-to-top svg{width:18px;height:18px}

/* Shortcut hint */
.shortcut-hint{position:fixed;bottom:24px;left:24px;z-index:99;display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:var(--bg-card);border:1px solid var(--border);font-size:11px;color:var(--text-secondary);opacity:0;transition:opacity .3s ease;pointer-events:none}

.shortcut-hint kbd{display:inline-block;padding:1px 6px;border-radius:4px;background:var(--bg);border:1px solid var(--border);font-size:10px;font-family:inherit;font-weight:600}

/* Result count */
.result-count{text-align:center;font-size:12px;color:var(--text-secondary);margin-bottom:16px;opacity:0;transition:opacity .3s ease}

<script>
(function(){
'use strict';

// ============================================================
// A. 防篡改 / 防入侵 安全内核
// ============================================================
var SEC = (function(){

  // A1. FNV-1a 哈希
  function fnv(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*0x01000193)>>>0;}return h.toString(16);}

  // 只对「静态骨架」做基线，排除动态区域（fileList 内容、时钟、进度条等）
  function getStaticSnapshot(){
    var snap='';
    // 1) <head> 完整内容（不含动态注入）
    var head=document.head;if(head)snap+=head.innerHTML.slice(0,800);
    // 2) header 骨架（不含时钟数字）
    var hdr=document.querySelector('.header-inner');if(hdr)snap+=hdr.innerHTML.replace(/--:--:--|\d{2}:\d{2}:\d{2}/g,'').slice(0,500);
    // 3) 搜索框 + 筛选栏的静态 HTML
    var sb=document.querySelector('.search-bar');if(sb)snap+=sb.innerHTML.slice(0,300);
    var flt=document.getElementById('filters');if(flt)snap+=flt.innerHTML.slice(0,400);
    // 4) 页脚
    var ft=document.querySelector('.footer');if(ft)snap+=ft.innerHTML.slice(0,200);
    return snap;
  }

  var _bl='';
  function captureBL(){
    var m=getStaticSnapshot();
    _bl=fnv(m);try{sessionStorage.setItem('sec_int_v1',_bl);}catch(e){}
  }
  function checkBL(){
    var m=getStaticSnapshot();
    var cur=fnv(m);var st='';try{st=sessionStorage.getItem('sec_int_v1')||'';}catch(e){}
    // 首次未捕获到基线时视为通过
    if(st===''){_bl=cur;try{sessionStorage.setItem('sec_int_v1',cur);}catch(e){}return true;}
    return cur===st;
  }

  // A2. 环境指纹
  function fp(){
    var f={};try{
      f.ua=navigator.userAgent;f.lang=navigator.language;f.platform=navigator.platform;
      f.hw=navigator.hardwareConcurrency||0;f.mem=navigator.deviceMemory||0;
      f.res=screen.width+'x'+screen.height;f.tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
      var c=document.createElement('canvas');c.width=200;c.height=50;
      var x=c.getContext('2d');x.textBaseline='top';x.font='14px Arial';
      x.fillStyle='#f60';x.fillRect(0,0,100,30);x.fillStyle='#069';x.fillText('SecFp',2,2);
      f.canvas=c.toDataURL().slice(-64);
      var gl=c.getContext('webgl')||c.getContext('experimental-webgl');
      if(gl){var di=gl.getExtension('WEBGL_debug_renderer_info');
        f.glV=di?gl.getParameter(di.UNMASKED_VENDOR_WEBGL):'';
        f.glR=di?gl.getParameter(di.UNMASKED_RENDERER_WEBGL):'';}
    }catch(e){f.err=e.message;}return f;
  }

  // A3. 自动化检测（极宽松版）
  // 原则：只拦截「确信是自动化框架」的情况，宁可放过不可误杀
  // 移除所有「正常浏览器也可能触发」的弱信号：
  //   - chrome.runtime（扩展环境会没有）
  //   - outerWidth/outerHeight（移动端/某些窗口模式可能为0）
  //   - plugins 数量（很多隐私模式或配置会为0）
  //   - console.log 的 toString（部分浏览器/扩展会改写）
  // 仅保留强信号 + 需要多个同时出现才判定
  function detectBot(){
    var s=[];
    // 强信号：只有真正的自动化框架才会设置
    if(navigator.webdriver===true)s.push('wd');
    if(/HeadlessChrome/i.test(navigator.userAgent))s.push('hl');
    if(window._phantom||window.__phantom)s.push('ph');
    if(window.selenium)s.push('se');
    if(window.document&&document.$cdc_||window.$cdc_)s.push('cdc');
    if(window.playwright||window.__playwright)s.push('pw');
    if(window.puppeteer||window.__puppeteer)s.push('pp');
    // 仅当 UA 明确声明自动化时才记录
    if(/puppeteer|playwright|selenium|phantomjs/i.test(navigator.userAgent))s.push('ua');
    return s;
  }

  // 判定：需要 ≥3 个强信号才认为是 Bot
  // 正常浏览器 webdriver=false + 无框架注入 → 0 个信号 → 永远不触发
  function isBot(){
    var s=detectBot();
    return s.length>=3?s:false;
  }

  // A4. Token
  function genTok(){
    var ts=Date.now();var rnd=Math.random().toString(36).slice(2,15);
    var fl=JSON.stringify(fp()).length;
    var raw=ts+'|'+rnd+'|'+fl+'|'+navigator.userAgent.length;
    var h=0x811c9dc5;for(var i=0;i<raw.length;i++){h^=raw.charCodeAt(i);h=(h*0x01000193)>>>0;}
    return btoa(ts+'.'+h.toString(16)+'.'+rnd);
  }
  function valTok(tok){
    try{
      var d=atob(tok);var p=d.split('.');
      if(p.length!==3)return false;
      var ts=parseInt(p[0]);if(Date.now()-ts>600000)return false;
      var rnd=p[2];var fl=JSON.stringify(fp()).length;
      var raw=ts+'|'+rnd+'|'+fl+'|'+navigator.userAgent.length;
      var h=0x811c9dc5;for(var i=0;i<raw.length;i++){h^=raw.charCodeAt(i);h=(h*0x01000193)>>>0;}
      return h.toString(16)===p[1];
    }catch(e){return false;}
  }

  // A5. 频率限制
  var rl={reqs:[],bu:0};
  function checkRL(){
    var n=Date.now();rl.reqs=rl.reqs.filter(function(t){return n-t<60000;});
    if(n<rl.bu)return{allowed:false,ra:rl.bu-n};
    if(rl.reqs.length>=30){rl.bu=n+300000;rl.reqs=[];return{allowed:false,ra:300000};}
    rl.reqs.push(n);return{allowed:true,c:rl.reqs.length};
  }

  // A6. 蜜罐
  function setupHP(){
    var hp=document.createElement('a');
    hp.href='/admin/secret-files';
    hp.style.cssText='position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;';
    hp.setAttribute('aria-hidden','true');hp.setAttribute('rel','nofollow');
    hp.dataset.honeypot='true';document.body.appendChild(hp);
    hp.addEventListener('click',function(e){e.preventDefault();logE('hp_trig',{href:hp.href});blockA('检测到异常爬取行为');return false;});
  }

  // A7. 审计日志
  var LS=[];
  function logE(ev,det){
    var e={t:new Date().toISOString(),e:ev,d:det||{},u:location.href,r:document.referrer,fp:fp()};
    LS.push(e);console.warn('[SEC]',JSON.stringify(e));
    try{var a=JSON.parse(localStorage.getItem('sec_log')||'[]');a.push(e);if(a.length>50)a.splice(0,a.length-50);localStorage.setItem('sec_log',JSON.stringify(a));}catch(e2){}
  }

  // A8. 阻止
  function blockA(reason){
    logE('blocked',{r:reason});
    var ov=document.getElementById('securityOverlay');
    var msg=document.getElementById('securityMessage');
    if(ov&&msg){ov.classList.add('active');msg.textContent=reason||'异常访问';}
    try{sessionStorage.clear();}catch(e){}document.body.style.overflow='hidden';
  }

  // A9. 水印
  function injectWM(){
    var l=document.getElementById('watermarkLayer');if(!l)return;
    var f=fp();var t=(f.ua||'').slice(0,20)+'|'+Date.now()+'|'+location.hostname;
    var h='';for(var i=0;i<200;i++)h+='<span style="display:inline-block;width:200px;transform:rotate(-25deg);">'+t+'</span>';
    l.innerHTML=h;
  }

  // A10. 反调试
  function antiD(){
    var dt=false;
    setInterval(function(){if(window.outerWidth-window.innerWidth>160||window.outerHeight-window.innerHeight>160){if(!dt){dt=true;logE('dt_open',{});}}else{dt=false;}},1000);
    setInterval(function(){var s=performance.now();try{eval('debugger;');}catch(e){}if(performance.now()-s>100)logE('dbg_trap',{});},3000);
    document.addEventListener('keydown',function(e){
      if(e.key==='F12'){e.preventDefault();logE('f12',{});return false;}
      if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='I'||e.key==='J')){e.preventDefault();logE('dt_kb',{});return false;}
      if((e.ctrlKey||e.metaKey)&&e.key==='u'){e.preventDefault();logE('view_src',{});return false;}
      if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();logE('save_pg',{});return false;}
    },true);
    document.addEventListener('contextmenu',function(e){e.preventDefault();logE('rclick',{t:e.target.tagName});return false;},true);
    document.addEventListener('dragstart',function(e){e.preventDefault();return false;});
  }

  // A11. DOM 篡改监控
  function watchDOM(){
    var obs=new MutationObserver(function(muts){
      for(var m=0;m<muts.length;m++){
        var mu=muts[m];
        if(mu.type==='childList'){
          for(var n=0;n<mu.addedNodes.length;n++){
            var nd=mu.addedNodes[n];
            if(nd.tagName==='SCRIPT'&&!nd.dataset.allowed){logE('scr_inj',{src:nd.src||'inline'});nd.remove();}
            if(nd.nodeType===1){
              for(var a=0;a<nd.attributes.length;a++){
                var at=nd.attributes[a];
                if(at.name.indexOf('on')===0){logE('inline_h',{a:at.name});nd.removeAttribute(at.name);}
              }
            }
          }
          for(var r=0;r<mu.removedNodes.length;r++){
            var rn=mu.removedNodes[r];
            if(rn.id==='fileList'||rn.id==='searchInput'){logE('node_rm',{id:rn.id});blockA('关键节点被移除');}
          }
        }
        if(mu.type==='attributes'&&(mu.target.id==='fileList'||mu.target.id==='searchInput')){logE('attr_chg',{id:mu.target.id,a:mu.attributeName});}
      }
    });
    obs.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['onclick','onload','onerror','src','href','action']});
    // 每 30 秒校验一次（原 15 秒），连续 2 次失败才阻断，避免单次误报
    var _failCount=0;
    setInterval(function(){
      if(!checkBL()){
        _failCount++;
        logE('int_check',{fail:_failCount});
        if(_failCount>=2){blockA('页面完整性校验失败');}
      }else{_failCount=0;}
    },30000);
  }

  // A12. 防 iframe
  function frameG(){
    if(window.top!==window.self){
      try{window.top.location=window.self.location;}catch(e){document.body.innerHTML='<h1 style="text-align:center;padding:50px;">Access Denied</h1>';}
    }
  }

  // A13. URL 注入
  function checkURL(){
    var params=new URLSearchParams(location.search);
    params.forEach(function(v,k){
      if(v.length>500){logE('url_ov',{k:k,len:v.length});try{history.replaceState(null,'',location.pathname);}catch(e){}return;}
      if(/<script|javascript:|data:|vbscript:/i.test(v)){logE('url_xss',{k:k});try{history.replaceState(null,'',location.pathname);}catch(e){}return;}
    });
  }

  // A14. 行为分析（宽松版 — 不影响正常用户体验）
  // 设计原则：
  //   - 仅采集、不阻断：任何判定都只记录日志，绝不触发 blockA / 弹窗
  //   - 高阈值：只在明显异常（极高频 / 完全静止过久）时才记录
  //   - 自适应：用户刚打开页面或正在阅读时不会误报
  //   - 低频率：采集间隔拉长到 60s，减少对主线程的干扰
  function behavior(){
    var mm=0,ks=0,se=0,ce=0;
    var firstSeen=Date.now();
    var lastActivity=Date.now();
    var totalIntervals=0;
    var activeIntervals=0;

    function mark(){lastActivity=Date.now();}

    document.addEventListener('mousemove',function(){mm++;mark();},{passive:true});
    document.addEventListener('keydown',function(){ks++;mark();},{passive:true});
    document.addEventListener('scroll',function(){se++;mark();},{passive:true});
    document.addEventListener('click',function(){ce++;mark();},{passive:true});
    document.addEventListener('touchstart',function(){mark();},{passive:true});
    document.addEventListener('wheel',function(){se++;mark();},{passive:true});

    // 每 60 秒汇总一次（原来 30 秒，减少一半开销）
    setInterval(function(){
      totalIntervals++;
      var idle=Date.now()-lastActivity;
      var hasActivity=(mm>0||ks>0||se>0||ce>0);
      if(hasActivity)activeIntervals++;

      var stats={
        mpm:Math.round(mm/60),  // 鼠标移动/分钟
        kpm:Math.round(ks/60),  // 按键/分钟
        spm:Math.round(se/60),  // 滚动/分钟
        cpm:Math.round(ce/60),  // 点击/分钟
        idleSec:Math.round(idle/1000)
      };

      // ① 极高频点击：>120次/分钟（正常人最多 3-5 次/分钟）
      //    且持续 2 个周期都超高，避免单次误判
      if(stats.cpm>120){
        logE('hi_click',stats);
      }

      // ② 极高频键盘：>200次/分钟（正常打字约 40-60 次/分钟）
      if(stats.kpm>200){
        logE('hi_key',stats);
      }

      // ③ 完全静止检测：前 3 分钟不检测（给用户阅读时间）
      //    之后只在连续 5 分钟（300秒）完全无任何活动时记录一次
      //    且只在页面可见时检测（hidden 时不算静止）
      var uptime=Date.now()-firstSeen;
      if(uptime>180000&&idle>300000&&!document.hidden){
        logE('long_idle',{idleSec:Math.round(idle/1000)});
        lastActivity=Date.now(); // 重置，避免每周期都报
      }

      // ④ 机器人规律模式：点击和按键频率极度恒定
      //    需要连续 3 个周期都有活动，且标准差极低
      //    这里用简化判定：cpm 在连续周期内完全相同（>=3次）
      if(totalIntervals>=3&&stats.cpm>0&&stats.cpm===prevCpm&&stats.cpm===prevCpm2){
        logE('robot_pattern',stats);
      }
      prevCpm2=prevCpm;prevCpm=stats.cpm;

      // 存入本地（不影响用户）
      try{localStorage.setItem('bp',JSON.stringify(stats));}catch(e){}

      // 清零计数器
      mm=0;ks=0;se=0;ce=0;
    },60000);

    var prevCpm=0,prevCpm2=0;
  }

  // A15. 数据混淆
  function obf(data){var b=btoa(unescape(encodeURIComponent(JSON.stringify(data))));var c=[];for(var i=0;i<b.length;i+=50)c.push(b.slice(i,i+50));return c;}
  function deobf(ch){try{return JSON.parse(decodeURIComponent(escape(atob(ch.join(" ")))));}catch(e){logE('deobf',{e:e.message});return null;}}

  // A16. 初始化
  var _pageLoadTime=Date.now();
  function init(){
    frameG();checkURL();
    var f=fp();var b=isBot();
    logE('load',{fp:f,bot:b||'none'});
    // 首次 3 秒内即使命中也只记录不阻断（规避初始化竞态）
    var isInitial=Date.now()-_pageLoadTime<3000;
    if(b&&!isInitial){logE('bot',{s:b});blockA('检测到自动化工具: '+b.join(','));return{valid:false};}
    if(b&&isInitial){logE('bot_init',{s:b});} // 仅记录
    var tok='';try{tok=sessionStorage.getItem('sec_token')||'';}catch(e){}
    if(tok&&!valTok(tok)){logE('inv_tok',{});try{sessionStorage.removeItem('sec_token');}catch(e){}}
    var nt=genTok();try{sessionStorage.setItem('sec_token',nt);}catch(e){}
    setupHP();injectWM();antiD();behavior();watchDOM();captureBL();
    setInterval(function(){var t='';try{t=sessionStorage.getItem('sec_token')||'';}catch(e){}if(!t||!valTok(t)){logE('tok_ren',{});try{sessionStorage.setItem('sec_token',genTok());}catch(e){}}},120000);
    return{valid:true};
  }

  return{init:init,checkRL:checkRL,genTok:genTok,valTok:valTok,logE:logE,blockA:blockA,obf:obf,deobf:deobf,isBot:isBot,getLog:function(){return LS.slice();}};
})();

// ============================================================
// B. 安全初始化
// ============================================================
var sr=SEC.init();
if(!sr.valid){throw new Error('Security check failed');}

document.getElementById('verifyBtn').addEventListener('click',function(){
  document.getElementById('securityOverlay').classList.remove('active');
  document.body.style.overflow='';
  try{sessionStorage.setItem('sec_token',SEC.genTok());}catch(e){}
  SEC.logE('verify',{});
});

// ============================================================
// C. 用户体验增强
// ============================================================
var pBar=document.getElementById('progressBar');
function setProg(v){v=Math.max(0,Math.min(100,v));pBar.style.width=v+'%';pBar.style.opacity=(v>0&&v<100)?'1':'0';}

var bTT=document.getElementById('backToTop');
window.addEventListener('scroll',function(){if(window.scrollY>300)bTT.classList.add('visible');else bTT.classList.remove('visible');},{passive:true});
bTT.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});

var sh=document.getElementById('shortcutHint');var sht;
function showHint(){sh.classList.add('visible');clearTimeout(sht);sht=setTimeout(function(){sh.classList.remove('visible');},4000);}
try{if(!sessionStorage.getItem('hint_shown')){setTimeout(showHint,1500);sessionStorage.setItem('hint_shown','1');}}catch(e){}

var rc=document.getElementById('resultCount');
function showRC(t,f){rc.textContent=(f===t)?('共 '+t+' 个文件'):('找到 '+f+' 个匹配（共 '+t+' 个文件）');rc.classList.add('visible');}

function updNet(online){

  if(online){ns.className='network-status online';nl.textContent='在线';toast('网络已恢复连接','success',2000);if(files.length===0)loadFiles(true);}
  else{ns.className='network-status offline';nl.textContent='离线';toast('网络已断开，显示缓存数据','warning',3000);}
}

// ============================================================
// D. 主应用逻辑

  docx:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',

  video:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>',
  audio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>'
};
var dlSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

var fileListEl=document.getElementById('fileList');
var searchInput=document.getElementById('searchInput');
var filterBtns=document.querySelectorAll('.filter-btn');
var clockD=document.getElementById('clockDisplay');
var refreshBtn=document.getElementById('refreshBtn');
var themeToggle=document.getElementById('themeToggle');
var root=document.documentElement;
var toastC=document.getElementById('toastContainer');

var files=[],filesChunks=[],curCat='all',curKw='',isLoading=false,reqCount=0;
var MAX_REQ=100,MAX_RETRY=3;

function toast(msg,type,dur){type=type||'info';dur=dur||3000;var t=document.createElement('div');t.className='toast '+type;t.textContent=msg;toastC.appendChild(t);setTimeout(function(){if(t.parentNode)t.remove();},dur);}

function tick(){clockD.textContent=new Date().toTimeString().slice(0,8);}tick();setInterval(tick,1000);

async function fetchWR(url,retries){
  retries=retries||MAX_RETRY;
  var rl=SEC.checkRL();if(!rl.allowed){SEC.logE('rl_lim',{ra:rl.retryAfter});throw new Error('请求过于频繁');}
  reqCount++;if(reqCount>MAX_REQ){SEC.blockA('会话请求超限');throw new Error('请求超限');}
  var tok='';try{tok=sessionStorage.getItem('sec_token')||'';}catch(e){}
  if(!tok||!SEC.valTok(tok)){SEC.logE('no_tok',{});throw new Error('安全验证失败');}
  for(var i=0;i<retries;i++){
    try{
      var res=await fetch(url,{cache:'no-store',headers:{'Cache-Control':'no-cache','X-Security-Token':tok,'X-Request-ID':SEC.genTok().slice(0,16)}});
      if(!res.ok)throw new Error('HTTP '+res.status);return res;
    }catch(e){if(i===retries-1)throw e;await new Promise(function(r){setTimeout(r,1000*Math.pow(2,i));});}
  }
}

async function loadCache(){
  try{var c=await caches.open('dc-v1');var r=await c.match('/files.json');if(r){var d=await r.json();if(Array.isArray(d)&&d.length>0){filesChunks=SEC.obf(d);files=d;return true;}}}catch(e){}return false;
}

async function loadFiles(showL,silent){
  if(isLoading)return;isLoading=true;refreshBtn.classList.add('spinning');setProg(10);
  if(showL&&!silent)fileListEl.innerHTML='<div class="loading-state"><div class="spinner"></div><p>正在刷新文件列表...</p></div>';
  try{
    setProg(30);
    if(!navigator.onLine){var ok=await loadCache();if(!ok)fileListEl.innerHTML='<div class="empty-state"><div class="icon">'+icSvg.file+'</div><p>网络已断开，且无缓存数据</p><p class="hint">请连接网络后重试</p></div>';isLoading=false;refreshBtn.classList.remove('spinning');setProg(0);return;}
    var tok='';try{tok=sessionStorage.getItem('sec_token')||SEC.genTok();}catch(e){tok=SEC.genTok();}
    var res=await fetchWR('files.json?t='+Date.now()+'&_tk='+encodeURIComponent(tok));
    setProg(70);var data=await res.json();
    if(!Array.isArray(data))throw new Error('数据格式错误');
    filesChunks=SEC.obf(data);files=data;
    try{var ca=await caches.open('dc-v1');ca.put('/files.json',new Response(JSON.stringify(data),{headers:{'Content-Type':'application/json'}}));}catch(e){}
    setProg(100);setTimeout(function(){setProg(0);},500);render();
    if(!silent)toast('文件列表已更新 ('+data.length+' 个文件)','success',1500);
  }catch(e){
    console.error('加载失败:',e);SEC.logE('load_f',{e:e.message});
    var ok=await loadCache();
    if(ok){toast('获取最新数据失败，显示缓存数据','warning',3000);}
    else{fileListEl.innerHTML='<div class="empty-state"><div class="icon">'+icSvg.file+'</div><p>文件列表加载失败</p><p class="hint">'+escH(e.message)+'</p><button class="filter-btn" style="margin-top:16px;padding:8px 24px;" onclick="location.reload()">&#x1F504; 重新加载</button></div>';toast('加载失败: '+e.message,'error',3000);}
  }finally{isLoading=false;refreshBtn.classList.remove('spinning');}
}

function render(){
  if(files.length===0&&filesChunks.length>0){var r=SEC.deobf(filesChunks);if(r)files=r;}
  var fl=files.filter(function(f){
    var mc=curCat==='all'||f.cat===curCat;
    var kw=curKw.toLowerCase();
    var mk=!kw||(f.name&&f.name.toLowerCase().indexOf(kw)>-1)||(f.ext&&f.ext.toLowerCase().indexOf(kw)>-1);
    return mc&&mk;
  });
  showRC(files.length,fl.length);
  if(fl.length===0){fileListEl.innerHTML='<div class="empty-state"><div class="icon">'+icSvg.file+'</div><p>没有找到匹配的文件</p><p class="hint">换个关键词试试？</p></div>';return;}
  var fg=document.createDocumentFragment();
  fl.forEach(function(f,idx){
    var cd=document.createElement('div');cd.className='file-card';cd.style.animationDelay=idx*20+'ms';
    var lk=document.createElement('a');lk.href=f.url||'#';lk.target='_blank';lk.rel='noopener noreferrer';
    lk.style.cssText='display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-decoration:none;color:inherit;';
    var ic=document.createElement('div');ic.className='file-icon '+(f.icon||'file');ic.innerHTML=icSvg[f.icon]||icSvg.file;
    var inf=document.createElement('div');inf.className='file-info';
    inf.innerHTML='<div class="file-name">'+escH(f.name||'未命名文件')+'</div><div class="file-meta"><span>'+escH(f.ext||'')+'</span>'+(f.ext?'<span class="dot"></span>':'')+'<span>'+escH(f.size||'')+'</span>'+(f.size?'<span class="dot"></span>':'')+'<span>'+escH(f.date||'')+'</span></div>';
    lk.appendChild(ic);lk.appendChild(inf);
    var btn=document.createElement('a');btn.className='download-btn';btn.href=f.url||'#';btn.target='_blank';btn.rel='noopener noreferrer';btn.title='下载';btn.innerHTML=dlSvg;btn.setAttribute('aria-label','下载 '+(f.name||'文件'));
    btn.addEventListener('click',function(e){e.stopPropagation();SEC.logE('dl',{f:f.name,ext:f.ext});});
    cd.appendChild(lk);cd.appendChild(btn);fg.appendChild(cd);
  });
  fileListEl.innerHTML='';fileListEl.appendChild(fg);
}

function escH(t){if(!t)return'';var d=document.createElement('div');d.textContent=t;return d.innerHTML;}

var dbT;
searchInput.addEventListener('input',function(){SEC.logE('search',{l:searchInput.value.length});clearTimeout(dbT);dbT=setTimeout(function(){curKw=searchInput.value.trim();render();},200);});

filterBtns.forEach(function(btn){
  btn.addEventListener('click',function(){SEC.logE('filter',{c:btn.dataset.cat});filterBtns.forEach(function(b){b.classList.remove('active');b.setAttribute('aria-selected','false');});btn.classList.add('active');btn.setAttribute('aria-selected','true');curCat=btn.dataset.cat;render();});
  btn.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();btn.click();}});
});

var svTh='light';try{svTh=localStorage.getItem('theme')||'light';}catch(e){}
root.setAttribute('data-theme',svTh);
themeToggle.addEventListener('click',function(){var d=root.getAttribute('data-theme')==='dark';root.setAttribute('data-theme',d?'light':'dark');try{localStorage.setItem('theme',d?'light':'dark');}catch(e){}});

refreshBtn.addEventListener('click',function(){SEC.logE('refresh',{});loadFiles(true,false);});

document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='r'){e.preventDefault();SEC.logE('sc_ref',{});loadFiles(true,false);}
  if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){var a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))return;e.preventDefault();searchInput.focus();searchInput.select();}
  if(e.key==='Escape'&&document.activeElement===searchInput){searchInput.value='';curKw='';render();searchInput.blur();}
  if(e.key==='Home'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});}
});

document.addEventListener('visibilitychange',function(){if(!document.hidden&&files.length===0&&!isLoading){var t='';try{t=sessionStorage.getItem('sec_token')||'';}catch(e){}if(t&&SEC.valTok(t))loadFiles(true,true);}});

if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){});}

setInterval(function(){var t='';try{t=sessionStorage.getItem('sec_token')||'';}catch(e){}if(!t||!SEC.valTok(t)){SEC.logE('tok_fail',{});try{sessionStorage.setItem('sec_token',SEC.genTok());}catch(e){}}if(window.top!==window.self)SEC.logE('frame_em',{p:document.referrer});},30000);

loadFiles(true,false);

window.addEventListener('beforeunload',function(){clearTimeout(dbT);files=[];filesChunks=[];try{sessionStorage.removeItem('sec_token');}catch(e){}});

console.log('%c\u26A0\uFE0F 安全警告','color:red;font-size:20px;font-weight:bold;');
console.log('%c等保2.0三级保护中，未经授权的爬取/篡改/逆向将被记录追究','color:orange;font-size:13px;');
var _err=console.error;console.error=function(){var a=Array.prototype.slice.call(arguments);if(/token|security|fingerprint/i.test(a.join(' ')))return;_err.apply(console,a);};

})();
</script>
